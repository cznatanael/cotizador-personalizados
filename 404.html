<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador — Personalizados</title>
<script>
/* Cualquier direccion equivocada regresa al cotizador, en vez de dejar al
   usuario en una pagina de error.

   El sitio vive en dos lados y la raiz no es la misma en los dos:
     - GitHub Pages : /cotizador-personalizados/
     - Vercel       : /
   Por eso se calcula, en vez de dejarla fija (si no, en Vercel se ciclaria). */
var base = location.hostname.indexOf('github.io') !== -1
  ? '/cotizador-personalizados/'
  : '/';
if (location.pathname !== base) location.replace(base);
</script>
