<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFBFD">
<meta name="description" content="Cotizador de productos personalizados: sublimación, vinil textil, corte láser e impresión 3D. Calcula el precio real a partir de tus costos.">
<meta name="robots" content="index,follow">
<!-- Para "Agregar a pantalla de inicio": abre sin barra de navegador en iOS y Android. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cotizador">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111113'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>Cotizador — Personalizados</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#FBFBFD; --surface:#FFFFFF; --surface-2:#F4F4F6; --surface-3:#EDEDF0;
  --ink:#0A0A0B; --ink-2:#57575F; --ink-3:#8E8E97;
  --line:#E6E6EA; --line-2:#D6D6DC;
  --brand:#111113; --brand-fg:#FFFFFF;
  --pos:#0E7C5A; --pos-bg:#E9F7F1;
  --warn:#9A6206; --warn-bg:#FDF4E3;
  --neg:#C2261B; --neg-bg:#FDEDEC;
  --info:#3538CD; --info-bg:#EEF2FF;
  --focus:#2563EB;
  --r-xl:20px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --tab-h:58px; --maxw:560px;
  --sh-1:0 1px 2px rgba(9,9,11,.05);
  --sh-2:0 8px 24px -8px rgba(9,9,11,.16), 0 2px 6px -2px rgba(9,9,11,.06);
  --sh-3:0 -6px 24px -10px rgba(9,9,11,.18);
  --safe-b:env(safe-area-inset-bottom,0px);
}

/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box}
/* El atributo hidden debe ganarle a cualquier display de autor (.sheet-wrap usa display:flex) */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.02em; color:var(--ink)}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; margin:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
.ico{display:block; flex:none}
.num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.wrap{width:100%; max-width:var(--maxw); margin:0 auto; padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(251,251,253,.82); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.topbar.is-stuck{border-bottom-color:var(--line)}
.topbar__in{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px}
.topbar__title{font-size:26px; letter-spacing:-.03em}
.topbar__act{display:flex; align-items:center; gap:6px}
.iconbtn{
  display:grid; place-items:center; width:34px; height:34px; border-radius:999px;
  color:var(--ink-2); background:var(--surface-2); transition:background .15s,color .15s;
}
.iconbtn:hover{background:var(--surface-3); color:var(--ink)}

/* ============ VIEW ============ */
.view{
  padding:6px 0 calc(var(--tab-h) + var(--safe-b) + 24px);
  min-height:60vh;
}
.view.has-dock{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 150px)}

/* ============ TABBAR ============ */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  height:calc(var(--tab-h) + var(--safe-b)); padding-bottom:var(--safe-b);
  display:flex; align-items:stretch;
  background:rgba(255,255,255,.88); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
}
.tabbar__b{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink-3); font-size:10.5px; font-weight:500; letter-spacing:.01em; transition:color .15s;
}
.tabbar__b[aria-selected="true"]{color:var(--ink)}
.tabbar__b:active{opacity:.6}

/* ============ DOCK (precio en vivo) ============ */
.dock{
  position:fixed; left:0; right:0; bottom:calc(var(--tab-h) + var(--safe-b)); z-index:45;
  background:rgba(255,255,255,.94); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line); box-shadow:var(--sh-3);
  padding:11px 0 13px;
  animation:dockIn .28s cubic-bezier(.22,1,.36,1);
}
@keyframes dockIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.dock__row{display:flex; align-items:flex-end; justify-content:space-between; gap:14px}
.dock__k{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:1px}
.dock__price{font-size:34px; font-weight:650; letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:1.05}
.dock__total{text-align:right}
.dock__total .v{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.dock__flags{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.dock__acts{display:flex; gap:9px; margin-top:11px}
.flash{animation:flash .45s ease}
@keyframes flash{0%{background:var(--info-bg)}100%{background:transparent}}
/* ============ BOTONES ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:46px; padding:0 18px; border-radius:var(--r-md);
  font-size:15px; font-weight:560; letter-spacing:-.01em;
  transition:transform .12s cubic-bezier(.22,1,.36,1), background .15s, opacity .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn--pri{background:var(--brand); color:var(--brand-fg)}
.btn--pri:hover{background:#2A2A2E}
.btn--sec{background:var(--surface); color:var(--ink); border:1px solid var(--line-2); box-shadow:var(--sh-1)}
.btn--sec:hover{background:var(--surface-2)}
.btn--ghost{background:var(--surface-2); color:var(--ink)}
.btn--ghost:hover{background:var(--surface-3)}
.btn--danger{background:var(--neg-bg); color:var(--neg)}
.btn--wide{flex:1}
.btn--sm{height:36px; padding:0 13px; font-size:13.5px; border-radius:var(--r-sm)}
.btn[disabled]{opacity:.4; pointer-events:none}
.linkbtn{color:var(--focus); font-size:13px; font-weight:560; padding:2px 0}
.linkbtn:hover{text-decoration:underline}

/* ============ PANEL / SECCIÓN ============ */
.sec{margin-top:22px}
.sec__hd{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 2px 9px}
.sec__t{font-size:11.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}
.sec__aside{font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); overflow:hidden;
}
.panel--pad{padding:16px}
.panel__row{display:flex; align-items:center; gap:12px; padding:13px 16px; border-top:1px solid var(--line)}
.panel__row:first-child{border-top:0}
.panel__row--btn{width:100%; text-align:left; justify-content:space-between}
.panel__row--btn:hover{background:var(--surface-2)}
.panel__lbl{flex:1; min-width:0; font-size:15px}
.panel__lbl small{display:block; font-size:12.5px; color:var(--ink-3); margin-top:1px; font-weight:400}
.panel__val{font-size:15px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ============ SEGMENTED SCROLL (técnicas) ============ */
.segs{
  display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding:3px 18px 3px; margin:0 -18px; -ms-overflow-style:none; scrollbar-width:none;
}
.segs::-webkit-scrollbar{display:none}
.seg{
  scroll-snap-align:start; flex:none;
  display:flex; align-items:center; gap:8px; height:44px; padding:0 16px;
  border-radius:999px; background:var(--surface); border:1px solid var(--line);
  font-size:14.5px; font-weight:540; color:var(--ink-2); box-shadow:var(--sh-1);
  transition:background .16s, color .16s, border-color .16s, transform .12s;
}
.seg:active{transform:scale(.96)}
.seg[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-fg); box-shadow:var(--sh-2)}

/* ============ CHIPS (productos / cantidades) ============ */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:inline-flex; align-items:center; height:38px; padding:0 15px;
  border-radius:999px; background:var(--surface); border:1px solid var(--line);
  font-size:14px; font-weight:500; color:var(--ink-2); transition:all .15s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:560}
.chip--sm{height:33px; padding:0 13px; font-size:13.5px; font-variant-numeric:tabular-nums}
.chip--add{gap:5px; border-style:dashed; color:var(--ink-3)}
.chip--add svg{margin-left:-2px}

/* ============ BADGES ============ */
.badge{
  display:inline-flex; align-items:center; gap:5px; height:25px; padding:0 10px;
  border-radius:999px; font-size:12px; font-weight:600; letter-spacing:-.005em; white-space:nowrap;
}
.badge--n{background:var(--surface-2); color:var(--ink-2)}
.badge--p{background:var(--pos-bg); color:var(--pos)}
.badge--w{background:var(--warn-bg); color:var(--warn)}
.badge--d{background:var(--neg-bg); color:var(--neg)}
.badge--i{background:var(--info-bg); color:var(--info)}
.badge .ico{width:13px;height:13px}
/* ============ CAMPOS ============ */
.fields{display:flex; flex-direction:column}
.field{padding:14px 16px; border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field__top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px}
.field__lbl{font-size:13.5px; font-weight:540; color:var(--ink-2); letter-spacing:-.005em}
.field__ctl{display:flex; align-items:center; gap:8px}
.inbox{
  display:flex; align-items:center; flex:1; min-width:0; height:46px;
  background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-md);
  padding:0 13px; gap:6px; transition:border-color .15s, background .15s;
}
.inbox:focus-within{background:var(--surface); border-color:var(--focus); box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.inbox__fix{font-size:15px; color:var(--ink-3); font-weight:500; flex:none}
.inbox input, .inbox select{
  flex:1; min-width:0; width:100%; height:100%;
  background:none; border:0; outline:none; padding:0;
  font-size:16px; font-weight:540; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; color:var(--ink);
}
.inbox select{appearance:none; -webkit-appearance:none; font-weight:540}
.inbox--sel{position:relative}
.inbox--sel::after{content:""; position:absolute; right:14px; width:8px; height:8px; border-right:1.7px solid var(--ink-3); border-bottom:1.7px solid var(--ink-3); transform:translateY(-2px) rotate(45deg); pointer-events:none}
.field__hint{margin-top:6px; font-size:12.5px; color:var(--ink-3); line-height:1.4}
.field__meta{margin-top:7px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3)}
.field.is-overridden .inbox{background:var(--info-bg); border-color:rgba(53,56,205,.22)}
.field.is-overridden .field__lbl{color:var(--info)}
.derived{margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--surface-2); border-radius:var(--r-sm); font-size:13px}
.derived b{font-weight:600; font-variant-numeric:tabular-nums}

/* ============ CAPAS / COLORES ============ */
.capa{padding:13px 16px; border-top:1px solid var(--line)}
.capa:first-child{border-top:0}
.capa__hd{display:flex; align-items:center; gap:9px; margin-bottom:9px}
.capa__n{
  flex:none; display:grid; place-items:center; width:23px; height:23px;
  border-radius:999px; background:var(--surface-3); color:var(--ink-2);
  font-size:11.5px; font-weight:650; font-variant-numeric:tabular-nums;
}
.capa__name{
  flex:1; min-width:0; height:36px; padding:0 11px;
  background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-sm);
  font:inherit; font-size:14.5px; font-weight:540; color:var(--ink); outline:none;
  transition:border-color .15s, background .15s;
}
.capa__name::placeholder{color:var(--ink-3); font-weight:400}
.capa__name:focus{background:var(--surface); border-color:var(--focus); box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.capa__del{
  flex:none; display:grid; place-items:center; width:36px; height:36px;
  border-radius:var(--r-sm); color:var(--ink-3);
}
.capa__del:hover{background:var(--neg-bg); color:var(--neg)}
.capa__grid{display:flex; flex-wrap:wrap; gap:8px}
.capa__f{flex:1 1 128px; min-width:0; display:block; cursor:text}
.capa__f>span{display:block; font-size:11.5px; font-weight:560; color:var(--ink-3); margin-bottom:4px}
.capa__f .inbox{height:42px; padding:0 11px}
.capa__f.is-overridden .inbox{background:var(--info-bg); border-color:rgba(53,56,205,.22)}
.capa__f.is-overridden>span{color:var(--info)}
.capa__cfg{display:block; margin-top:4px; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.capa__add{
  display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
  padding:13px 16px; border-top:1px dashed var(--line-2);
  font-size:14px; font-weight:560; color:var(--focus);
}
.capa__add:hover{background:var(--surface-2)}
.capas__hint{margin:8px 2px 0; font-size:12.5px; color:var(--ink-3); line-height:1.45}

/* ============ PROCESOS (varias técnicas sobre la misma pieza) ============ */
.proc{
  background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--focus); border-radius:var(--r-md);
  overflow:hidden; margin-bottom:10px;
}
.proc__hd{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line-2); background:var(--surface-2)}
.proc__n{
  display:grid; place-items:center; width:22px; height:22px; flex:none; border-radius:999px;
  background:var(--focus); color:#fff; font-size:11.5px; font-weight:700;
}
.proc__t{flex:1; min-width:0; font-size:14.5px; font-weight:600; line-height:1.25}
.proc__t small{display:block; font-size:11.5px; font-weight:450; color:var(--ink-3); margin-top:2px}
.proc__st{
  padding:11px 16px 5px; font-size:11.5px; font-weight:600;
  letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);
}
.proc__hint{margin:0 0 10px; font-size:12.5px; color:var(--ink-3); line-height:1.45}
.proc .capa{border-top:1px solid var(--line-2)}
.bd-sub{
  margin:10px 0 4px; font-size:11.5px; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; color:var(--focus);
}

/* ============ STEPPER ============ */
.stepper{display:flex; align-items:center; gap:10px}
.stepper__b{
  display:grid; place-items:center; width:46px; height:46px; flex:none;
  border-radius:var(--r-md); background:var(--surface-2); color:var(--ink);
  transition:background .15s, transform .12s;
}
.stepper__b:hover{background:var(--surface-3)}
.stepper__b:active{transform:scale(.93)}
.stepper__b[disabled]{opacity:.35; pointer-events:none}
.stepper input{
  flex:1; min-width:0; height:46px; text-align:center; background:var(--surface-2);
  border:1px solid transparent; border-radius:var(--r-md); outline:none;
  font-size:19px; font-weight:620; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
}
.stepper input:focus{background:var(--surface); border-color:var(--focus); box-shadow:0 0 0 3px rgba(37,99,235,.12)}

/* ============ SLIDER ============ */
.slider{width:100%; -webkit-appearance:none; appearance:none; height:30px; background:none; outline:none; margin:0}
.slider::-webkit-slider-runnable-track{height:5px; border-radius:999px; background:var(--surface-3)}
.slider::-moz-range-track{height:5px; border-radius:999px; background:var(--surface-3)}
.slider::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; margin-top:-10.5px; border-radius:50%; background:#fff; border:1px solid var(--line-2); box-shadow:var(--sh-2); cursor:grab}
.slider::-moz-range-thumb{width:26px; height:26px; border:1px solid var(--line-2); border-radius:50%; background:#fff; box-shadow:var(--sh-2); cursor:grab}
.bigpct{display:flex; align-items:baseline; gap:7px}
.bigpct b{font-size:38px; font-weight:640; letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:1}
.bigpct span{font-size:14px; color:var(--ink-3)}

/* ============ SWITCH ============ */
.sw{position:relative; width:50px; height:30px; flex:none; border-radius:999px; background:var(--surface-3); transition:background .2s}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:var(--sh-1),0 1px 3px rgba(0,0,0,.15); transition:transform .22s cubic-bezier(.22,1,.36,1)}
.sw[aria-checked="true"]{background:var(--pos)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* ============ BARRA DE MERCADO ============ */
.mkt__hd{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px}
.mkt__v{font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.mkt__bar{position:relative; height:8px; border-radius:999px; background:var(--surface-3); margin:26px 0 10px}
.mkt__range{position:absolute; top:0; bottom:0; border-radius:999px; background:var(--pos-bg); border:1px solid rgba(14,124,90,.25)}
.mkt__mark{position:absolute; top:-7px; width:3px; height:22px; border-radius:999px; background:var(--ink); transform:translateX(-1.5px)}
.mkt__mark::after{
  content:attr(data-v); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  font-size:11.5px; font-weight:640; white-space:nowrap; color:var(--ink); font-variant-numeric:tabular-nums;
}
.mkt__legend{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.mkt__msg{margin-top:12px; font-size:13px; line-height:1.45; color:var(--ink-2)}

/* ============ DOCUMENTO PARA PDF / IMPRESIÓN ============ */
#printDoc{display:none}
@media print{
  /* El margen va DENTRO del documento (padding), no en @page: si el diálogo de
     impresión está en "Márgenes: Ninguno" el texto se iría al filo y se cortaría. */
  @page{size:letter; margin:0}
  html,body{background:#fff !important; margin:0 !important; padding:0 !important}
  #app,#sheetWrap,#toast{display:none !important}
  #printDoc{display:block !important; box-sizing:border-box; width:100%; padding:16mm 15mm; color:#111; font-size:12pt; line-height:1.5; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  #printDoc *{box-sizing:border-box; max-width:100%}
  .pd__hd{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; border-bottom:2px solid #111; padding-bottom:12px}
  .pd__neg{font-size:19pt; font-weight:700; letter-spacing:-.02em; margin:0; overflow-wrap:anywhere}
  .pd__tel{font-size:10.5pt; color:#444; margin:3px 0 0}
  .pd__meta{text-align:right; font-size:10.5pt; color:#444; white-space:nowrap; flex:none}
  .pd__meta b{color:#111}
  .pd__t{font-size:14pt; font-weight:700; margin:22px 0 4px}
  .pd__cli{font-size:11.5pt; color:#333; margin:14px 0 18px}
  .pd__tbl{width:100%; table-layout:fixed; border-collapse:collapse; margin-top:6px}
  .pd__tbl th{text-align:left; font-size:9.5pt; text-transform:uppercase; letter-spacing:.06em; color:#555; border-bottom:1px solid #bbb; padding:0 0 7px}

    "bambuP1S": { "nombre": "Impresora 3D Bambu Lab P1S", "costoCompraMxn": 12000, "vidaUtilHoras": 5000, "watts": 300, "mantenimientoAnualMxn": 500, "horasUsoAnual": 900 }
  },

  "mapeoProductoMaquina": {

    "playera": { "sublimacion": ["impresoraSublimacion", "planchaPlana"], "vinilTextil": ["cricutMaker", "planchaPlana"] },
    "gorra": { "sublimacion": ["impresoraSublimacion", "planchaGorra"], "vinilTextil": ["cricutMaker", "planchaGorra"] },
    "tumbler": { "sublimacion": ["impresoraSublimacion", "planchaTumbler"] },
    "tequilero": { "sublimacion": ["impresoraSublimacion", "planchaTequilero"] },

  },

  "catalogoInsumos": {
    "sublimacion": { "costoPorHojaSublimacion": 3.30, "blancoTazaDefault": 30, "blancoPlayeraDefault": 100, "blancoGorraDefault": 48, "blancoTumblerDefault": 135, "blancoTequileroDefault": 25 },
    "vinil": { "costoPorMetroVinilTextil": 230, "costoPorMetroVinilAdhesivo": 110, "blancoPlayeraDefault": 110, "blancoGorraDefault": 48 },
    "laser": { "costoHojaMdf3mmDefault": 110, "medidasHojaMdfCm": "60x90", "costoHojaAcrilicoDefault": 95 },
    "impresion3d": { "costoPorGramoPLA": 0.32, "costoPorGramoPETG": 0.38 }
  },

  "tablaMayoreo": [
    { "rangoMin": 1, "rangoMax": 5, "descuentoPct": 0.00, "etiqueta": "Menudeo" },
    { "rangoMin": 6, "rangoMax": 11, "descuentoPct": 0.05, "etiqueta": "Mayoreo chico" },
    { "rangoMin": 12, "rangoMax": 23, "descuentoPct": 0.10, "etiqueta": "Mayoreo medio" },
    { "rangoMin": 24, "rangoMax": 49, "descuentoPct": 0.15, "etiqueta": "Mayoreo grande" },
    { "rangoMin": 50, "rangoMax": 99, "descuentoPct": 0.20, "etiqueta": "Mayoreo mayor" },
    { "rangoMin": 100, "rangoMax": null, "descuentoPct": 0.25, "etiqueta": "Institucional" }
  ],

  "reglasRedondeo": { "umbralBajo": 100, "multiploBajoUmbralBajo": 0.5, "umbralAlto": 500, "multiploEntreUmbrales": 5, "multiploSobreUmbralAlto": 10 }
};

/* ============ 2. DATOS DE MERCADO MX (sección 6 DATOS_MERCADO_MX.md) ============ */
/* Rangos MXN por pieza (menudeo/mayoreo); null = sin dato confiable para esa combinación */
const MERCADO_MX = {
  "sublimacion_taza": { menudeo: [120, 199], mayoreo: null, nota: "Taza sublimada" },
  "sublimacion_playera": { menudeo: [110, 165], mayoreo: [98, 130], nota: "Playera sublimada full print" },
  "sublimacion_gorra": { menudeo: [100, 150], mayoreo: [50, 90], nota: "Gorra personalizada" },
  "sublimacion_tumbler": { menudeo: [180, 280], mayoreo: [90, 130], nota: "Tumbler 20oz personalizado" },
  "sublimacion_tequilero": { menudeo: [40, 80], mayoreo: [20, 30], nota: "Tequilero personalizado" },
  "vinil_playera": { menudeo: [180, 280], mayoreo: [110, 150], nota: "Playera vinil textil" },
  "vinil_gorra": { menudeo: [100, 150], mayoreo: [50, 90], nota: "Gorra personalizada" },
  "vinil_superficieRigida": { menudeo: null, mayoreo: null, nota: null },
  "laser_mdf": { menudeo: [25, 60], mayoreo: [10, 12], nota: "Llavero MDF láser (mayoreo desde 25 pzas)" },
  "laser_acrilico": { menudeo: [40, 120], mayoreo: [15, 40], nota: "Topper/letrero láser" },
  "laser_objetoCliente": { menudeo: null, mayoreo: null, nota: null },
  "impresion3d_objetoImpresion3d": { porGramo: true, menudeo: [4, 8], mayoreo: [2, 4], nota: "Impresión 3D por gramo" }
};
/* ============ 3. MOTOR DE CÁLCULO (funciones puras, verificadas con test-calc.mjs) ============ */
function costoMaquinaHora(maquina, tarifaKwh, valorRescatePct) {
  const dep = (maquina.costoCompraMxn - maquina.costoCompraMxn * valorRescatePct) / maquina.vidaUtilHoras;
  const mant = maquina.mantenimientoAnualMxn / maquina.horasUsoAnual;
  const luz = (maquina.watts / 1000) * tarifaKwh;
  return { dep, mant, luz, total: dep + mant + luz };
}

function redondeoPsicologico(precio, reglas) {
  if (precio <= 0) return 0;
  const EPS = 1e-9;
  let multiplo;
  if (precio < reglas.umbralBajo) multiplo = reglas.multiploBajoUmbralBajo;
  else if (precio <= reglas.umbralAlto) multiplo = reglas.multiploEntreUmbrales;
  else multiplo = reglas.multiploSobreUmbralAlto;
  const r = Math.ceil((precio - EPS) / multiplo) * multiplo;
  return Math.round(r * 100) / 100;
}

function obtenerRangoMayoreo(cantidad, tabla) {
  for (const r of tabla) {
    if (cantidad >= r.rangoMin && (r.rangoMax === null || r.rangoMax === undefined || cantidad <= r.rangoMax)) return r;
  }
  return tabla[tabla.length - 1];
}

/* Override de una sola vez: si el usuario escribió un valor válido lo usa,
   si no cae al valor de configuración. 0 es un override válido. */
function numOverride(v, fallback) {
  if (v === undefined || v === null || v === '') return fallback;
  const n = Number(v);
  return isNaN(n) ? fallback : n;
}

function maquinaRequerida(config, id, contexto) {
  const m = config.maquinas[id];
  if (!m) throw new Error('No existe la máquina "' + id + '" que pide ' + contexto + '. Revísala en Ajustes.');
  return m;
}

function breakdownSublimacion(inputs, config) {
  const { producto, cantidad, costoBlanco, hojas, minutosProduccion, minutosDisenoPedido } = inputs;
  const g = config.configGlobal;
  const merma = g.mermaPct.sublimacion;
  const costoHojaCfg = config.catalogoInsumos.sublimacion.costoPorHojaSublimacion;
  const costoHoja = numOverride(inputs.costoHojaOverride, costoHojaCfg);
  const materialesBase = (costoBlanco || 0) + (hojas || 0) * costoHoja;
  const costoMaterialesConMerma = materialesBase * (1 + merma);

  // La plancha puede venir explícita (productos propios); si no, se deduce del producto base.
  const idPlancha = inputs.idPlancha || { taza: 'planchaTaza', playera: 'planchaPlana', gorra: 'planchaGorra', tumbler: 'planchaTumbler', tequilero: 'planchaTequilero' }[producto];
  const plancha = maquinaRequerida(config, idPlancha, 'el producto "' + producto + '"');
  const chImpresora = costoMaquinaHora(config.maquinas.impresoraSublimacion, g.tarifaKwh, g.valorRescatePct);
  const chPlancha = costoMaquinaHora(plancha, g.tarifaKwh, g.valorRescatePct);
  const fr = config.fraccionesTiempo.sublimacion;
  const horasImpresora = (minutosProduccion * fr.impresora) / 60;
  const horasPlancha = (minutosProduccion * fr.plancha) / 60;
  const costoImpresora = horasImpresora * chImpresora.total;
  const costoPlancha = horasPlancha * chPlancha.total;

  const tiempoDisenoProrrateado = minutosDisenoPedido / cantidad;
  const costoProduccion = g.sueldoHora * (minutosProduccion / 60);
  const costoDiseno = g.sueldoHora * (tiempoDisenoProrrateado / 60);

  return {
    materiales: {
      base: materialesBase, mermaPct: merma, total: costoMaterialesConMerma,
      lineas: [
        { label: 'Blanco (producto base)', qty: 1, unidad: 'pza', unitario: costoBlanco || 0, total: costoBlanco || 0 },
        { label: 'Papel de sublimación', qty: hojas || 0, unidad: 'hoja', unitario: costoHoja, total: (hojas || 0) * costoHoja, override: costoHoja !== costoHojaCfg, valorConfig: costoHojaCfg }
      ]
    },
    maquina: {
      total: costoImpresora + costoPlancha,
      detalle: [
        { nombre: config.maquinas.impresoraSublimacion.nombre, horas: horasImpresora, costoHora: chImpresora.total, dep: chImpresora.dep, mant: chImpresora.mant, luz: chImpresora.luz, subtotal: costoImpresora },
        { nombre: plancha.nombre, horas: horasPlancha, costoHora: chPlancha.total, dep: chPlancha.dep, mant: chPlancha.mant, luz: chPlancha.luz, subtotal: costoPlancha }
      ]
    },
    manoObra: { produccionMin: minutosProduccion, costoProduccion, disenoMinOriginal: minutosDisenoPedido, disenoMinProrrateado: tiempoDisenoProrrateado, costoDiseno, total: costoProduccion + costoDiseno }
  };
}

function breakdownVinil(inputs, config) {
  const { producto, cantidad, costoBlanco, cmVinil, minutosProduccion, minutosDisenoPedido } = inputs;
  const g = config.configGlobal;
  const tipoVinil = inputs.tipoVinil || (producto === 'superficieRigida' ? 'adhesivo' : 'textil');
  const merma = g.mermaPct.vinil;
  const costoPorMetroCfg = tipoVinil === 'textil' ? config.catalogoInsumos.vinil.costoPorMetroVinilTextil : config.catalogoInsumos.vinil.costoPorMetroVinilAdhesivo;
  const costoPorMetro = numOverride(inputs.costoPorMetroVinil, costoPorMetroCfg);

  /* Una capa por color. Sin `capas` se usa la ruta de un solo color, con la
     misma aritmética de siempre (por eso los números del modelo no se mueven). */
  const capas = (Array.isArray(inputs.capas) && inputs.capas.length)
    ? inputs.capas
    : [{ nombre: '', cm: cmVinil || 0, costoPorMetro: costoPorMetro }];
  const nCapas = capas.length;
  const lineasVinil = capas.map((c, i) => {
    const cpm = numOverride(c.costoPorMetro, costoPorMetro);
    const cm = Number(c.cm) || 0;
    const nombre = String(c.nombre || '').trim();
    return {
      label: 'Vinil ' + tipoVinil + ((nCapas > 1 || nombre) ? ' · ' + (nombre || 'Capa ' + (i + 1)) : ''),
      qty: cm, unidad: 'cm', unitario: cpm / 100, total: (cm / 100) * cpm,
      override: cpm !== costoPorMetroCfg, valorConfig: costoPorMetroCfg
    };
  });
  const costoVinilLinea = lineasVinil.reduce((a, l) => a + l.total, 0);
  const materialesBase = (costoBlanco || 0) + costoVinilLinea;
  const costoMaterialesConMerma = materialesBase * (1 + merma);

  // Cada color extra es otro corte, otro deshierbe y otro planchado.
  const minutosExtraCapas = (Number(inputs.minutosPorCapaExtra) || 0) * Math.max(0, nCapas - 1);
  const minProduccion = (minutosProduccion || 0) + minutosExtraCapas;

  const fr = tipoVinil === 'textil' ? config.fraccionesTiempo.vinilTextil : config.fraccionesTiempo.vinilAdhesivo;
  const chCricut = costoMaquinaHora(config.maquinas.cricutMaker, g.tarifaKwh, g.valorRescatePct);
  const horasCricut = (minProduccion * fr.cricut) / 60;
  const costoCricut = horasCricut * chCricut.total;
  const detalleMaquina = [{ nombre: config.maquinas.cricutMaker.nombre, horas: horasCricut, costoHora: chCricut.total, dep: chCricut.dep, mant: chCricut.mant, luz: chCricut.luz, subtotal: costoCricut }];
  let costoPlancha = 0;
  if (tipoVinil === 'textil') {
    const idPlancha = inputs.idPlancha || (producto === 'gorra' ? 'planchaGorra' : 'planchaPlana');
    const plancha = maquinaRequerida(config, idPlancha, 'el producto "' + producto + '"');
    const chPlancha = costoMaquinaHora(plancha, g.tarifaKwh, g.valorRescatePct);
    const horasPlancha = (minProduccion * fr.plancha) / 60;
    costoPlancha = horasPlancha * chPlancha.total;
    detalleMaquina.push({ nombre: plancha.nombre, horas: horasPlancha, costoHora: chPlancha.total, dep: chPlancha.dep, mant: chPlancha.mant, luz: chPlancha.luz, subtotal: costoPlancha });
  }

  const tiempoDisenoProrrateado = minutosDisenoPedido / cantidad;
  const costoProduccion = g.sueldoHora * (minProduccion / 60);
  const costoDiseno = g.sueldoHora * (tiempoDisenoProrrateado / 60);

  return {
    tipoVinil,
    capas: { n: nCapas, minutosExtra: minutosExtraCapas, materialTotal: costoVinilLinea },
    materiales: {
      base: materialesBase, mermaPct: merma, total: costoMaterialesConMerma,
      lineas: [
        { label: 'Blanco (producto base)', qty: 1, unidad: 'pza', unitario: costoBlanco || 0, total: costoBlanco || 0 }
      ].concat(lineasVinil)
    },
    maquina: { total: costoCricut + costoPlancha, detalle: detalleMaquina },
    manoObra: { produccionMin: minProduccion, costoProduccion, disenoMinOriginal: minutosDisenoPedido, disenoMinProrrateado: tiempoDisenoProrrateado, costoDiseno, total: costoProduccion + costoDiseno }
  };
}

function breakdownLaser(inputs, config) {
  const { minutosLaser, minutosAcabado, minutosDisenoPedido, cantidad } = inputs;
  const g = config.configGlobal;
  const merma = g.mermaPct.laser;

  /* Cada capa es una pieza que se corta y se encima: material y láser propios.
     Sin `capas` se conserva la ruta clásica de una sola pieza. */
  const capas = (Array.isArray(inputs.capas) && inputs.capas.length) ? inputs.capas : null;
  const nCapas = capas ? capas.length : 1;
  let costoMaterialPorPieza, minLaser, lineas;
  if (capas) {
    lineas = capas.map((c, i) => {
      const cp = Number(c.costoPorPieza) || 0;
      const nombre = String(c.nombre || '').trim();
      const base = (nCapas > 1 || nombre) ? 'Material · ' + (nombre || 'Capa ' + (i + 1)) : 'Material';
      const suf = c.piezasPorHoja ? ' (' + c.piezasPorHoja + ' pzas por hoja)' : ' por pieza';
      return { label: base + suf, qty: 1, unidad: 'pza', unitario: cp, total: cp, hojaTotal: c.costoHoja };
    });
    costoMaterialPorPieza = lineas.reduce((a, l) => a + l.total, 0);
    minLaser = capas.reduce((a, c) => a + (Number(c.minutosLaser) || 0), 0);
  } else {
    costoMaterialPorPieza = inputs.costoMaterialPorPieza || 0;
    minLaser = minutosLaser || 0;
    const piezasPorHoja = inputs.piezasPorHoja;
    lineas = piezasPorHoja
      ? [{ label: 'Material (' + piezasPorHoja + ' pzas por hoja)', qty: 1, unidad: 'pza', unitario: costoMaterialPorPieza, total: costoMaterialPorPieza, hojaTotal: inputs.costoHojaMaterial }]
      : [{ label: 'Material por pieza', qty: 1, unidad: 'pza', unitario: costoMaterialPorPieza, total: costoMaterialPorPieza }];
  }

  const costoMaterialesConMerma = costoMaterialPorPieza * (1 + merma);
  const chLaser = costoMaquinaHora(config.maquinas.falconA10W, g.tarifaKwh, g.valorRescatePct);
  const horasLaser = minLaser / 60;
  const costoMaquinaTotal = horasLaser * chLaser.total;
  const tiempoDisenoProrrateado = minutosDisenoPedido / cantidad;
  const costoProduccion = g.sueldoHora * ((minLaser + minutosAcabado) / 60);
  const costoDiseno = g.sueldoHora * (tiempoDisenoProrrateado / 60);
  return {
    capas: { n: nCapas, minutosExtra: 0, materialTotal: costoMaterialPorPieza },
    materiales: { base: costoMaterialPorPieza, mermaPct: merma, total: costoMaterialesConMerma, lineas },
    maquina: { total: costoMaquinaTotal, detalle: [{ nombre: config.maquinas.falconA10W.nombre, horas: horasLaser, costoHora: chLaser.total, dep: chLaser.dep, mant: chLaser.mant, luz: chLaser.luz, subtotal: costoMaquinaTotal }] },
    manoObra: { produccionMin: minLaser + minutosAcabado, costoProduccion, disenoMinOriginal: minutosDisenoPedido, disenoMinProrrateado: tiempoDisenoProrrateado, costoDiseno, total: costoProduccion + costoDiseno }
  };
}

function breakdown3D(inputs, config) {
  const { gramos, tipoFilamento, horasImpresion, minutosPostProceso, minutosDisenoPedido, cantidad } = inputs;
  const g = config.configGlobal;
  const merma = g.mermaPct.impresion3d;
  const costoPorGramoCfg = tipoFilamento === 'PLA' ? config.catalogoInsumos.impresion3d.costoPorGramoPLA : config.catalogoInsumos.impresion3d.costoPorGramoPETG;
  const costoPorGramo = numOverride(inputs.costoPorGramo, costoPorGramoCfg);

  /* Un renglón por color de filamento. Sin `capas`, un solo color. */
  const capas = (Array.isArray(inputs.capas) && inputs.capas.length)
    ? inputs.capas
    : [{ nombre: '', gramos: gramos || 0, costoPorGramo: costoPorGramo }];
  const nCapas = capas.length;
  const lineas = capas.map((c, i) => {
    const cpg = numOverride(c.costoPorGramo, costoPorGramo);
    const gr = Number(c.gramos) || 0;
    const nombre = String(c.nombre || '').trim();
    return {
      label: 'Filamento ' + (tipoFilamento || 'PLA') + ((nCapas > 1 || nombre) ? ' · ' + (nombre || 'Color ' + (i + 1)) : ''),
      qty: gr, unidad: 'g', unitario: cpg, total: gr * cpg,
      override: cpg !== costoPorGramoCfg, valorConfig: costoPorGramoCfg
    };
  });
  const materialesBase = lineas.reduce((a, l) => a + l.total, 0);
  const costoMaterialesConMerma = materialesBase * (1 + merma);

  // Cada cambio de color cuesta tiempo (purga, cambio de bobina, supervisión).
  const minutosExtraCapas = (Number(inputs.minutosPorCambioColor) || 0) * Math.max(0, nCapas - 1);

  const chBambu = costoMaquinaHora(config.maquinas.bambuP1S, g.tarifaKwh, g.valorRescatePct);
  const costoMaquinaTotal = (horasImpresion || 0) * chBambu.total;
  const supervisionProrrateada = g.tiempoSupervisionImpresion3DMin / cantidad;
  const tiempoDisenoProrrateado = minutosDisenoPedido / cantidad;
  const produccionMin = supervisionProrrateada + minutosPostProceso + minutosExtraCapas;
  const costoProduccion = g.sueldoHora * (produccionMin / 60);
  const costoDiseno = g.sueldoHora * (tiempoDisenoProrrateado / 60);
  return {
    capas: { n: nCapas, minutosExtra: minutosExtraCapas, materialTotal: materialesBase },
    materiales: { base: materialesBase, mermaPct: merma, total: costoMaterialesConMerma, lineas },
    maquina: { total: costoMaquinaTotal, detalle: [{ nombre: config.maquinas.bambuP1S.nombre, horas: horasImpresion || 0, costoHora: chBambu.total, dep: chBambu.dep, mant: chBambu.mant, luz: chBambu.luz, subtotal: costoMaquinaTotal }] },
    manoObra: { produccionMin, supervisionProrrateada, costoProduccion, disenoMinOriginal: minutosDisenoPedido, disenoMinProrrateado: tiempoDisenoProrrateado, costoDiseno, total: costoProduccion + costoDiseno }
  };
}

function calcularBreakdown(tecnica, inputs, config) {
  if (tecnica === 'sublimacion') return breakdownSublimacion(inputs, config);
  if (tecnica === 'vinil') return breakdownVinil(inputs, config);
  if (tecnica === 'laser') return breakdownLaser(inputs, config);
  if (tecnica === 'impresion3d') return breakdown3D(inputs, config);
  throw new Error('Técnica desconocida: ' + tecnica);
}

function costoDirectoDe(bd) { return bd.materiales.total + bd.maquina.total + bd.manoObra.total; }

/* Varios procesos sobre la MISMA pieza: una playera con 3 viniles, sublimación
   a 4 tintas y grabado láser es UN producto, no tres cotizaciones.
   El blanco (la prenda) lo cobra sólo el proceso principal; los demás llegan con
   costoBlanco 0 para no cobrarlo dos y tres veces. Cada proceso conserva su
   propia merma, sus máquinas y su tiempo, y todo se suma antes del overhead. */
function combinarBreakdowns(partes) {
  const materialesBase = partes.reduce((a, p) => a + p.breakdown.materiales.base, 0);
  const materialesTotal = partes.reduce((a, p) => a + p.breakdown.materiales.total, 0);
  const lineas = [];
  const detalle = [];
  const mo = { produccionMin: 0, costoProduccion: 0, disenoMinOriginal: 0, disenoMinProrrateado: 0, costoDiseno: 0, total: 0 };
  partes.forEach((p, k) => {
    for (const l of p.breakdown.materiales.lineas) {
      // El blanco de los procesos extra viene en 0: mostrarlo confundiría.
      if (k > 0 && l.total === 0 && l.label.indexOf('Blanco') === 0) continue;
      lineas.push(Object.assign({}, l, { proceso: p.label }));
    }
    for (const d of p.breakdown.maquina.detalle) detalle.push(Object.assign({}, d, { proceso: p.label }));
    const m = p.breakdown.manoObra;
    mo.produccionMin += m.produccionMin;
    mo.costoProduccion += m.costoProduccion;
    mo.disenoMinOriginal += m.disenoMinOriginal;
    mo.disenoMinProrrateado += m.disenoMinProrrateado;
    mo.costoDiseno += m.costoDiseno;
    mo.total += m.total;
  });
  return {
    procesos: partes.map(p => ({ tecnica: p.tecnica, label: p.label, costo: costoDirectoDe(p.breakdown) })),
    capas: partes[0].breakdown.capas,
    tipoVinil: partes[0].breakdown.tipoVinil,
    materiales: {
      base: materialesBase,
      mermaPct: materialesBase > 0 ? (materialesTotal / materialesBase - 1) : 0,
      total: materialesTotal, lineas
    },
    maquina: { total: partes.reduce((a, p) => a + p.breakdown.maquina.total, 0), detalle },
    manoObra: mo
  };
}

/* `procesos[0]` es el principal (el que trae el blanco). Con uno solo devuelve
   el breakdown tal cual, así que las cotizaciones de siempre no cambian ni un peso. */
function calcularBreakdownMulti(procesos, config) {
  const partes = procesos.map((p, k) => ({
    tecnica: p.tecnica,
    label: p.label || p.tecnica,
    breakdown: calcularBreakdown(p.tecnica, k === 0 ? p.inputs : Object.assign({}, p.inputs, { costoBlanco: 0 }), config)
  }));
  if (partes.length === 1) return partes[0].breakdown;
  return combinarBreakdowns(partes);
}

function calcularCotizacion({ breakdown, cantidad, config, utilidadMenudeoPctOverride, aplicaComisionOverride }) {
  const g = config.configGlobal;
  const costoDirecto = breakdown.materiales.total + breakdown.maquina.total + breakdown.manoObra.total;
  const costoTotal = costoDirecto * (1 + g.overheadPct);
  const utilidadPct = (utilidadMenudeoPctOverride === undefined || utilidadMenudeoPctOverride === null || isNaN(utilidadMenudeoPctOverride)) ? g.utilidadMenudeoPct : utilidadMenudeoPctOverride;
  const precioMenudeoBruto = costoTotal * (1 + utilidadPct);
  const precioMenudeoFinal = redondeoPsicologico(precioMenudeoBruto, config.reglasRedondeo);
  const rango = obtenerRangoMayoreo(cantidad, config.tablaMayoreo);
  const descuentoPct = rango ? rango.descuentoPct : 0;
  const precioConDescuento = precioMenudeoFinal * (1 - descuentoPct);
  const piso = costoTotal * (1 + g.utilidadMinimaPct);
  const seAplicoPiso = piso > precioConDescuento + 1e-9;
  let precioFinalBruto = Math.max(precioConDescuento, piso);

  // Comisión de venta en línea: opt-in. Se repercute para no comerse la utilidad.
  const aplicaComision = (aplicaComisionOverride === undefined || aplicaComisionOverride === null) ? !!g.aplicaComisionVentaOnline : !!aplicaComisionOverride;
  const comisionPct = aplicaComision ? (g.comisionVentaOnlinePct || 0) : 0;
  const precioAntesComision = precioFinalBruto;
  if (comisionPct > 0 && comisionPct < 1) precioFinalBruto = precioFinalBruto / (1 - comisionPct);
  const montoComision = precioFinalBruto - precioAntesComision;

  const precioFinal = redondeoPsicologico(precioFinalBruto, config.reglasRedondeo);
  return {
    costoDirecto, costoTotal, utilidadPctUsada: utilidadPct, precioMenudeoBruto, precioMenudeoFinal,
    rango, descuentoPct, precioConDescuento, piso, seAplicoPiso,
    aplicaComision, comisionPct, montoComision, precioAntesComision,
    precioFinal, totalPedido: Math.round(precioFinal * cantidad * 100) / 100, breakdown
  };
}

function obtenerReferenciaMercado(tecnica, producto, rangoEtiqueta, gramosOpcional) {
  const info = MERCADO_MX[tecnica + '_' + producto];
  if (!info) return null;
  const usarMayoreo = rangoEtiqueta !== 'Menudeo' && !!info.mayoreo;
  const base = usarMayoreo ? info.mayoreo : info.menudeo;
  if (!base) return null;
  if (info.porGramo) {
    if (!gramosOpcional) return null;
    return { rango: [Math.round(base[0] * gramosOpcional * 100) / 100, Math.round(base[1] * gramosOpcional * 100) / 100], esMayoreo: usarMayoreo, nota: info.nota, porGramo: true };
  }
  return { rango: base, esMayoreo: usarMayoreo, nota: info.nota, porGramo: false };
}

const FORMATO_MXN = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function formatMXN(n) {
  if (n === null || n === undefined || isNaN(n)) return '$0.00';
  return FORMATO_MXN.format(n);
}
function formatNum(n, dec) {
  if (n === null || n === undefined || isNaN(n)) return '0';
  return n.toLocaleString('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function formatFecha(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) + ' · ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
function generarId() { return 'q_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
function clonarConfig(cfg) { return JSON.parse(JSON.stringify(cfg)); }
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), obj); }
function setPath(obj, path, value) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) { o = o[keys[i]]; }
  o[keys[keys.length - 1]] = value;
}
function mergeConfigProfundo(base, override) {
  if (override === null || override === undefined) return base;
  if (Array.isArray(override)) return override;
  if (typeof override === 'object') {
    const out = Object.assign({}, base);
    for (const k of Object.keys(override)) { out[k] = mergeConfigProfundo(base ? base[k] : undefined, override[k]); }
    return out;
  }
  return override;
}
function casiIgual(a, b) { return Math.abs(Number(a) - Number(b)) < 1e-9; }

    const raw = localStorage.getItem(LS_HISTORIAL);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}
function guardarHistorialStorage(hist) {
  try { localStorage.setItem(LS_HISTORIAL, JSON.stringify(hist)); return true; } catch (e) { console.warn('No se pudo guardar historial', e); return false; }
}
function cargarUltimosStorage() {
  try { return JSON.parse(localStorage.getItem(LS_ULTIMOS) || '{}') || {}; } catch (e) { return {}; }
}
function guardarUltimosStorage(o) {
  try { localStorage.setItem(LS_ULTIMOS, JSON.stringify(o)); return true; } catch (e) { return false; }
}
function cargarProductosStorage() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_PRODUCTOS) || '[]');

function guardarProductosStorage(arr) {

/* ============ 11. CAMPOS POR TÉCNICA (sección 4 del modelo) ============
   Los campos con `configPath` son overrides de una sola vez: se pueden editar
   al cotizar sin tocar la configuración guardada.                        */
function camposFormulario(tecnica, producto, inputs) {
  inputs = inputs || {};
  const cat = state.config.catalogoInsumos;
  const cap = producto.charAt(0).toUpperCase() + producto.slice(1);
  const prod = buscarProducto(tecnica, producto) || {};

  if (tecnica === 'sublimacion') {
    const blancoDef = prod.propio ? (prod.costoBlancoDefault || 0) : (cat.sublimacion['blanco' + cap + 'Default'] || 0);
    const modo = inputs.hojaModo || 'hoja';
    const cfgHoja = getPath(state.config, 'catalogoInsumos.sublimacion.costoPorHojaSublimacion');
    const campoPapel = modo === 'paquete'
      ? [
        { id: 'costoPaquete', group: 'material', label: 'Precio del paquete', type: 'money', prefix: '$', min: 0, step: 10, value: Math.round(cfgHoja * 100 * 100) / 100 },
        { id: 'hojasPorPaquete', group: 'material', label: 'Hojas que trae el paquete', type: 'decimal', min: 1, step: 10, value: 100, suffix: 'hojas' }
      ]
      : [{ id: 'costoHojaOverride', group: 'material', label: 'Costo por hoja', type: 'money', prefix: '$', min: 0, step: 0.1, suffix: '/hoja', configPath: 'catalogoInsumos.sublimacion.costoPorHojaSublimacion' }];
    return [
      { id: 'costoBlanco', group: 'material', label: 'Costo del blanco', type: 'money', prefix: '$', min: 0, step: 1, value: blancoDef },
      { id: 'hojas', group: 'material', label: 'Hojas de sublimación', type: 'decimal', min: 0, step: 0.1, value: 1, suffix: 'hojas' },
      { id: 'hojaModo', group: 'material', label: '¿Cómo compras el papel?', type: 'select', value: 'hoja', options: [{ value: 'hoja', label: 'Por hoja' }, { value: 'paquete', label: 'Por paquete' }] }
    ].concat(campoPapel, [
      { id: 'minutosProduccion', group: 'tiempo', label: 'Impresión + planchado', type: 'int', min: 0, step: 1, value: 7, suffix: 'min' },
      { id: 'minutosDisenoPedido', group: 'tiempo', label: 'Diseño (todo el pedido)', type: 'int', min: 0, step: 1, value: 10, suffix: 'min', hint: 'Se prorratea entre las piezas del pedido.' }
    ]);
  }

  if (tecnica === 'vinil') {
    const textil = prod.propio ? prod.soporte !== 'rigido' : producto !== 'superficieRigida';
    const cfgPath = textil ? 'catalogoInsumos.vinil.costoPorMetroVinilTextil' : 'catalogoInsumos.vinil.costoPorMetroVinilAdhesivo';
    const cfgMetro = getPath(state.config, cfgPath);
    const modo = inputs.vinilModo || 'metro';
    const blancoDef = prod.propio ? (prod.costoBlancoDefault || 0) : (textil ? (cat.vinil['blanco' + cap + 'Default'] || 0) : 0);
    // El vinil usado y su costo viven en las capas (un renglón por color).
    const campoVinil = modo === 'rollo'
      ? [
        { id: 'costoRollo', group: 'material', label: 'Precio del rollo', type: 'money', prefix: '$', min: 0, step: 50, value: Math.round(cfgMetro * 5 * 100) / 100 },
        { id: 'metrosRollo', group: 'material', label: 'Metros que trae el rollo', type: 'decimal', min: 0.1, step: 1, value: 5, suffix: 'm' }
      ]
      : [];
    const extra = numCapas(inputs) > 1
      ? [{ id: 'minutosPorCapaExtra', group: 'tiempo', label: 'Minutos extra por color adicional', type: 'int', min: 0, step: 1, value: 4, suffix: 'min', hint: 'Corte, deshierbe y planchado de cada color después del primero.' }]
      : [];
    return [
      { id: 'costoBlanco', group: 'material', label: textil ? 'Costo del blanco (prenda)' : 'Costo del objeto o superficie', type: 'money', prefix: '$', min: 0, step: 1, value: blancoDef, hint: textil ? '' : 'Déjalo en $0 si el cliente trae el objeto.' },
      { id: 'vinilModo', group: 'material', label: '¿Cómo compras el vinil?', type: 'select', value: 'metro', options: [{ value: 'metro', label: 'Por metro' }, { value: 'rollo', label: 'Por rollo' }] }
    ].concat(campoVinil, [
      { id: 'minutosProduccion', group: 'tiempo', label: textil ? 'Corte + deshierbe + planchado' : 'Corte + deshierbe + aplicación', type: 'int', min: 0, step: 1, value: 12, suffix: 'min' }
    ], extra, [
      { id: 'minutosDisenoPedido', group: 'tiempo', label: 'Diseño (todo el pedido)', type: 'int', min: 0, step: 1, value: 8, suffix: 'min', hint: 'Se prorratea entre las piezas del pedido.' }
    ]);
  }

  if (tecnica === 'laser') {
    const esCliente = producto === 'objetoCliente';
    // Un lápiz o un vaso se compran por pieza, no por hoja. El modo lo decide el producto.
    const modoDefault = prod.propio ? (prod.materialModo || 'pieza') : (esCliente ? 'pieza' : 'hoja');
    // El material y los minutos de láser viven en las capas (un renglón por pieza cortada).
    return [
      { id: 'materialModo', group: 'material', label: '¿Cómo compras el material?', type: 'select', value: modoDefault, options: [{ value: 'hoja', label: 'Por hoja (me salen varias piezas)' }, { value: 'pieza', label: 'Por pieza (lápiz, vaso, objeto suelto)' }] },
      { id: 'minutosAcabado', group: 'tiempo', label: 'Armado y acabado', type: 'int', min: 0, step: 1, value: 4, suffix: 'min', hint: numCapas(inputs) > 1 ? 'Incluye el tiempo de pegar y alinear las capas.' : '' },
      { id: 'minutosDisenoPedido', group: 'tiempo', label: 'Diseño (todo el pedido)', type: 'int', min: 0, step: 1, value: 15, suffix: 'min', hint: 'Se prorratea entre las piezas del pedido.' }
    ];
  }

  if (tecnica === 'impresion3d') {
    // Los gramos y el costo del filamento viven en las capas (un renglón por color).
    const extra = numCapas(inputs) > 1
      ? [{ id: 'minutosPorCambioColor', group: 'tiempo', label: 'Minutos extra por cambio de color', type: 'int', min: 0, step: 1, value: 3, suffix: 'min', hint: 'Purga, cambio de bobina y supervisión de cada color después del primero.' }]
      : [];
    return [
      { id: 'tipoFilamento', group: 'material', label: 'Tipo de filamento', type: 'select', value: 'PLA', options: [{ value: 'PLA', label: 'PLA' }, { value: 'PETG', label: 'PETG' }] },
      { id: 'filamentoModo', group: 'material', label: '¿Cómo compras el filamento?', type: 'select', value: 'kilo', options: [{ value: 'kilo', label: 'Por kilo (rollo)' }, { value: 'gramo', label: 'Por gramo' }] },
      { id: 'horasImpresion', group: 'tiempo', label: 'Impresión por pieza', type: 'decimal', min: 0, step: 0.1, value: 3.5, suffix: 'h' },
      { id: 'minutosPostProceso', group: 'tiempo', label: 'Post-proceso por pieza', type: 'int', min: 0, step: 1, value: 8, suffix: 'min' }
    ].concat(extra, [
      { id: 'minutosDisenoPedido', group: 'tiempo', label: 'Diseño y laminado (todo el pedido)', type: 'int', min: 0, step: 1, value: 10, suffix: 'min', hint: 'Se prorratea entre las piezas del pedido.' }
    ]);
  }
  return [];
}

/* ============ 11b. CAPAS / COLORES ============
   Un renglón por color (vinil, filamento) o por pieza encimada (láser).
   Vive en `inputs.capas`; la técnica decide qué campos lleva cada renglón. */
const MAX_CAPAS = 8;

function numCapas(inputs) {
  return (inputs && Array.isArray(inputs.capas) && inputs.capas.length) ? inputs.capas.length : 1;
}

function especCapas(tecnica, producto, inputs) {
  inputs = inputs || {};
  const prod = buscarProducto(tecnica, producto) || {};
  const cat = state.config.catalogoInsumos;

  if (tecnica === 'vinil') {
    const textil = prod.propio ? prod.soporte !== 'rigido' : producto !== 'superficieRigida';
    const cfgPath = textil ? 'catalogoInsumos.vinil.costoPorMetroVinilTextil' : 'catalogoInsumos.vinil.costoPorMetroVinilAdhesivo';
    const porRollo = (inputs.vinilModo || 'metro') === 'rollo';
    const campos = [{ key: 'cm', label: 'Vinil', type: 'decimal', min: 0, step: 1, suffix: 'cm', value: 25 }];
    if (!porRollo) campos.push({ key: 'costoPorMetro', label: 'Costo del vinil', type: 'money', prefix: '$', suffix: '/m', min: 0, step: 5, configPath: cfgPath });
    return {
      titulo: 'Colores / capas', singular: 'color', plural: 'colores',
      alta: 'Agregar color', placeholder: 'Color (ej. Negro)',
      ayuda: porRollo
        ? 'Todos los colores salen del mismo rollo. Cambia a «por metro» si cada color te cuesta distinto.'
        : 'Un renglón por color. Cada color extra es otro corte, otro deshierbe y otro planchado.',
      campos
    };
  }

  if (tecnica === 'impresion3d') {
    const fil = inputs.tipoFilamento || 'PLA';
    const cfgPath = fil === 'PLA' ? 'catalogoInsumos.impresion3d.costoPorGramoPLA' : 'catalogoInsumos.impresion3d.costoPorGramoPETG';
    const porKilo = (inputs.filamentoModo || 'kilo') === 'kilo';
    return {
      titulo: 'Colores de filamento', singular: 'color', plural: 'colores',
      alta: 'Agregar color', placeholder: 'Color (ej. Rojo)',
      ayuda: 'Un renglón por color. Si tu impresora purga filamento en cada cambio, agrega un renglón llamado «Purga» con esos gramos.',
      campos: [
        { key: 'gramos', label: 'Filamento', type: 'decimal', min: 0, step: 1, suffix: 'g', value: 42 },
        porKilo
          ? { key: 'costoPorGramo', label: 'Precio del rollo', type: 'money', prefix: '$', suffix: '/kg', min: 0, step: 10, configPath: cfgPath, factor: 1000 }
          : { key: 'costoPorGramo', label: 'Costo', type: 'money', prefix: '$', suffix: '/g', min: 0, step: 0.01, configPath: cfgPath }
      ]
    };
  }

  if (tecnica === 'laser') {
    const esCliente = producto === 'objetoCliente';
    const cfgPath = producto === 'mdf' ? 'catalogoInsumos.laser.costoHojaMdf3mmDefault'
      : producto === 'acrilico' ? 'catalogoInsumos.laser.costoHojaAcrilicoDefault' : null;
    const modoDefault = prod.propio ? (prod.materialModo || 'pieza') : (esCliente ? 'pieza' : 'hoja');
    const modo = inputs.materialModo || modoDefault;
    const campos = modo === 'pieza'
      ? [{ key: 'costoPieza', label: esCliente ? 'Material propio' : 'Costo por pieza', type: 'money', prefix: '$', suffix: '/pza', min: 0, step: 1, value: esCliente ? 0 : (prod.costoBlancoDefault || 0) }]
      : [
        { key: 'costoHoja', label: 'Hoja completa', type: 'money', prefix: '$', min: 0, step: 5, configPath: cfgPath, value: cfgPath ? undefined : 0 },
        { key: 'piezasPorHoja', label: 'Piezas por hoja', type: 'int', min: 1, step: 1, suffix: 'pzas', value: 8 }
      ];
    campos.push({ key: 'minutosLaser', label: 'Láser', type: 'int', min: 0, step: 1, suffix: 'min', value: 6 });
    return {
      titulo: 'Capas de material', singular: 'capa', plural: 'capas',
      alta: 'Agregar capa', placeholder: 'Capa (ej. Base MDF)',
      ayuda: (modo === 'hoja' && producto === 'mdf' ? 'Hoja de ' + cat.laser.medidasHojaMdfCm + ' cm. ' : '') +
        'Una capa por cada pieza que se corta y se encima. Sube «Armado y acabado» si hay que pegarlas.',
      campos
    };
  }
  return null; // Sublimación imprime a todo color en un solo transfer: no lleva capas.
}

function valorDefaultCapa(f) {
  if (f.value !== undefined) return f.value;
  if (f.configPath) return getPath(state.config, f.configPath);
  return 0;
}
function capaNueva(esp) {
  const c = { nombre: '' };
  for (const f of esp.campos) c[f.key] = valorDefaultCapa(f);
  return c;
}
/* Rellena los huecos sin borrar lo que el usuario ya tenía en otros modos. */
function capasNormalizadas(esp, previas) {
  const src = (Array.isArray(previas) && previas.length) ? previas.slice(0, MAX_CAPAS) : [{}];
  return src.map(p => {
    const c = Object.assign({}, p || {});
    c.nombre = typeof c.nombre === 'string' ? c.nombre : '';
    for (const f of esp.campos) {
      if (c[f.key] === undefined || c[f.key] === null || c[f.key] === '') c[f.key] = valorDefaultCapa(f);
    }
    return c;
  });
}
/* Gramos totales del pedido: el mercado de impresión 3D se cotiza por gramo. */
function gramosTotales() {
  const capas = state.cot.inputs.capas;
  if (Array.isArray(capas) && capas.length) return capas.reduce((a, c) => a + (Number(c.gramos) || 0), 0);
  return Number(state.cot.inputs.gramos) || 0;
}

/* ============ 11c. PROCESOS SOBRE LA MISMA PIEZA ============
   Un pedido real combina técnicas: playera con 3 viniles + sublimación a 4
   tintas + grabado láser. El proceso 0 es el principal (define el producto y
   carga el costo del blanco); `state.cot.procesos` guarda los que van encima. */
const MAX_PROCESOS = 4;

function procesosExtra() { return state.cot.procesos || (state.cot.procesos = []); }
function numProcesos() { return 1 + procesosExtra().length; }

/* k === null → el principal; k = 0,1,2… → el proceso extra correspondiente. */
function procDe(k) {
  if (k === null || k === undefined || k === '') {
    return { tecnica: state.cot.tecnica, producto: state.cot.producto, inputs: state.cot.inputs };
  }
  return procesosExtra()[Number(k)];
}
function procK(el) {
  const v = el.dataset ? el.dataset.proc : undefined;
  return (v === undefined || v === '') ? null : Number(v);
}

/* Qué producto usa un proceso extra. Importa sólo para elegir la plancha y el
   tipo de vinil: el blanco ya lo cobró el principal. */
function productoParaProceso(tecnica, productoPrincipal) {
  if (tecnica === 'laser') return 'objetoCliente';
  if (tecnica === 'impresion3d') return 'objetoImpresion3d';
  return buscarProducto(tecnica, productoPrincipal) ? productoPrincipal : PRODUCTOS[tecnica][0].id;
}

function procesoNuevo(tecnica, previos) {
  const producto = productoParaProceso(tecnica, state.cot.producto);
  const inputs = defaultsFormulario(tecnica, producto, previos || {});
  inputs.costoBlanco = 0;   // la pieza ya se cobró en el proceso principal
  return { tecnica, producto, inputs };
}

/* Campos visibles de un proceso extra: sin el blanco, que ya está cobrado. */
function camposDeProceso(k) {
  const p = procDe(k);
  const campos = camposFormulario(p.tecnica, p.producto, p.inputs);
  return k === null ? campos : campos.filter(c => c.id !== 'costoBlanco');
}

/* Reencaja los procesos extra cuando cambia el producto principal (la plancha
   de una gorra no es la de una playera). */
function reajustarProcesos() {
  procesosExtra().forEach(p => {
    const prodNuevo = productoParaProceso(p.tecnica, state.cot.producto);
    if (prodNuevo === p.producto) return;
    p.producto = prodNuevo;
    p.inputs = defaultsFormulario(p.tecnica, prodNuevo, p.inputs);
    p.inputs.costoBlanco = 0;
  });
}

/* Lista lista para el motor: principal + extras, cada uno ya traducido. */
function procesosParaMotor() {
  const lista = [{ tecnica: state.cot.tecnica, label: etiquetaProceso(null), inputs: inputsParaMotor(null) }];
  procesosExtra().forEach((p, k) => lista.push({ tecnica: p.tecnica, label: etiquetaProceso(k), inputs: inputsParaMotor(k) }));
  return lista;
}
function etiquetaProceso(k) {
  const p = procDe(k);
  const t = buscarTecnica(p.tecnica);
  return t ? t.label : p.tecnica;
}

/* Valor por defecto de un campo: `value` explícito o el valor vivo de configuración. */
function valorDefaultCampo(c) {
  if (c.value !== undefined) return c.value;
  if (c.configPath) return getPath(state.config, c.configPath);
  return c.type === 'select' ? '' : 0;
}

/* Reconstruye los inputs conservando lo que el usuario ya escribió. */
function defaultsFormulario(tecnica, producto, previos) {
  const base = {};
  const campos = camposFormulario(tecnica, producto, previos || {});
  for (const c of campos) base[c.id] = valorDefaultCampo(c);
  if (previos) {
    for (const c of campos) {
      if (previos[c.id] !== undefined && previos[c.id] !== null && previos[c.id] !== '') base[c.id] = previos[c.id];
    }
  }
  // Las capas se normalizan con los modos ya resueltos (rollo/metro, hoja/pieza, kilo/gramo).
  const esp = especCapas(tecnica, producto, base);
  if (esp) base.capas = capasNormalizadas(esp, previos && previos.capas);
  return base;
}

/* Traduce los inputs de la UI a los inputs que espera el motor.
   Aquí se convierte lo que el usuario COMPRA (paquete, rollo, hoja) a la unidad
   que necesita el cálculo (hoja, metro, pieza). */
function inputsParaMotor(k) {
  const pr = procDe(k);
  const tecnica = pr.tecnica, producto = pr.producto, inputs = pr.inputs;
  const cantidad = Math.max(1, parseInt(state.cot.cantidad, 10) || 1);
  const prod = buscarProducto(tecnica, producto) || {};
  const out = Object.assign({}, inputs, { producto, cantidad });

  if (tecnica === 'sublimacion') {
    if (prod.propio && prod.plancha) out.idPlancha = prod.plancha;
    if (out.hojaModo === 'paquete') {
      const hojas = Number(out.hojasPorPaquete) || 1;
      out.costoHojaOverride = (Number(out.costoPaquete) || 0) / (hojas || 1);
    }
  }

  if (tecnica === 'vinil') {
    if (prod.propio) {
      out.tipoVinil = prod.soporte === 'rigido' ? 'adhesivo' : 'textil';
      if (out.tipoVinil === 'textil') out.idPlancha = prod.plancha || 'planchaPlana';
    }
    if (out.vinilModo === 'rollo') {
      const metros = Number(out.metrosRollo) || 1;
      out.costoPorMetroVinil = (Number(out.costoRollo) || 0) / (metros || 1);
    }
    if (Array.isArray(inputs.capas)) {
      const porRollo = out.vinilModo === 'rollo';
      out.capas = inputs.capas.map(c => {
        const o = { nombre: c.nombre, cm: Number(c.cm) || 0 };
        // Comprando por rollo todos los colores comparten el precio del rollo.
        if (!porRollo) o.costoPorMetro = c.costoPorMetro;
        return o;
      });
      out.cmVinil = out.capas.reduce((a, c) => a + c.cm, 0);
    }
  }

  if (tecnica === 'impresion3d' && Array.isArray(inputs.capas)) {
    out.capas = inputs.capas.map(c => ({ nombre: c.nombre, gramos: Number(c.gramos) || 0, costoPorGramo: c.costoPorGramo }));
    out.gramos = out.capas.reduce((a, c) => a + c.gramos, 0);
  }

  if (tecnica === 'laser') {
    const modo = out.materialModo || (prod.propio ? (prod.materialModo || 'pieza') : (producto === 'objetoCliente' ? 'pieza' : 'hoja'));
    if (Array.isArray(inputs.capas)) {
      out.capas = inputs.capas.map(c => {
        const pph = modo === 'hoja' ? Math.max(1, Number(c.piezasPorHoja) || 1) : null;
        const costoHoja = modo === 'hoja' ? (Number(c.costoHoja) || 0) : undefined;
        return {
          nombre: c.nombre,
          costoPorPieza: modo === 'hoja' ? costoHoja / pph : (Number(c.costoPieza) || 0),
          piezasPorHoja: pph, costoHoja,
          minutosLaser: Number(c.minutosLaser) || 0
        };
      });
      out.costoMaterialPorPieza = out.capas.reduce((a, c) => a + c.costoPorPieza, 0);
      out.minutosLaser = out.capas.reduce((a, c) => a + c.minutosLaser, 0);
      out.piezasPorHoja = modo === 'hoja' ? out.capas[0].piezasPorHoja : null;
    } else if (modo === 'pieza') {
      out.costoMaterialPorPieza = Number(out.costoPiezaMaterial) || 0;
      out.piezasPorHoja = null;
    } else {
      const porHoja = Math.max(1, Number(out.piezasPorHoja) || 1);
      out.costoMaterialPorPieza = (Number(out.costoHojaMaterial) || 0) / porHoja;
      out.piezasPorHoja = porHoja;
    }
  }

  return out;
}

/* Costo por unidad ya derivado, para mostrarlo en vivo bajo los campos de compra. */
function derivadoCompra(k) {
  const pr = procDe(k);
  const tecnica = pr.tecnica, inputs = pr.inputs;
  const m = inputsParaMotor(k);
  if (tecnica === 'laser') return { label: 'Material por pieza', valor: m.costoMaterialPorPieza };
  if (tecnica === 'sublimacion' && inputs.hojaModo === 'paquete') return { label: 'Sale cada hoja en', valor: m.costoHojaOverride };
  if (tecnica === 'vinil' && inputs.vinilModo === 'rollo') return { label: 'Sale el metro en', valor: m.costoPorMetroVinil };
  if (tecnica === 'impresion3d' && numCapas(inputs) === 1) return { label: 'Sale el gramo en', valor: Number((inputs.capas || [{}])[0].costoPorGramo) || 0 };
  return null;
}

/* Campos con override activo (difieren de la configuración), en todos los procesos. */
function overridesActivos() {
  const lista = [];
  const revisar = (k) => {
    const pr = procDe(k);
    const pref = k === null ? '' : 'p' + k + '.';
    const campos = camposFormulario(pr.tecnica, pr.producto, pr.inputs);
    for (const c of campos) {
      if (c.configPath && !casiIgual(pr.inputs[c.id], getPath(state.config, c.configPath))) lista.push({ id: pref + c.id, configPath: c.configPath });
    }
    const esp = especCapas(pr.tecnica, pr.producto, pr.inputs);
    if (!esp) return;
    const capas = pr.inputs.capas || [];
    for (const f of esp.campos) {
      if (!f.configPath) continue;
      const cfg = getPath(state.config, f.configPath);
      capas.forEach((c, i) => { if (!casiIgual(c[f.key], cfg)) lista.push({ id: pref + 'capa' + i + '.' + f.key, configPath: f.configPath }); });
    }
  };
  revisar(null);
  procesosExtra().forEach((_, k) => revisar(k));
  return lista;
}
/* ============ 12. RENDER DE CAMPOS ============
   `k` identifica el proceso: null = el principal (ids de siempre: f-xxx),
   0,1,2… = un proceso extra (ids fp0-xxx y data-proc="0"). */
function idCampo(id, k) { return k === null ? 'f-' + id : 'fp' + k + '-' + id; }
function claveWrap(id, k) { return k === null ? id : 'p' + k + '-' + id; }
function attrProc(k) { return k === null ? '' : ' data-proc="' + k + '"'; }

function campoHTML(c, k) {
  if (k === undefined) k = null;
  const inputs = procDe(k).inputs;
  const f = c.factor || 1;
  const raw = inputs[c.id];
  // `factor` = cuántas unidades base trae la unidad de compra (1 kg = 1000 g).
  // Se guarda siempre en la unidad base; sólo se MUESTRA en la de compra.
  const val = f !== 1 && raw !== '' && raw !== undefined && raw !== null ? Math.round(Number(raw) * f * 1e6) / 1e6 : raw;
  const cfgValBase = c.configPath ? getPath(state.config, c.configPath) : null;
  const cfgVal = c.configPath && f !== 1 ? Math.round(cfgValBase * f * 1e6) / 1e6 : cfgValBase;
  const isOv = !!c.configPath && !casiIgual(raw, cfgValBase);
  const eid = idCampo(c.id, k);
  let ctl;
  if (c.type === 'select') {
    ctl = '<div class="inbox inbox--sel"><select id="' + eid + '" data-field="' + c.id + '"' + attrProc(k) + ' data-type="select">' +
      c.options.map(o => '<option value="' + escapeHtml(o.value) + '"' + (String(val) === String(o.value) ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>').join('') +
      '</select></div>';
  } else {
    const mode = c.type === 'int' ? 'numeric' : 'decimal';
    ctl = '<div class="inbox">' +
      (c.prefix ? '<span class="inbox__fix">' + escapeHtml(c.prefix) + '</span>' : '') +
      '<input id="' + eid + '" data-field="' + c.id + '"' + attrProc(k) + ' data-type="' + c.type + '" data-factor="' + f + '" type="number" inputmode="' + mode + '"' +
      (c.min !== undefined ? ' min="' + c.min + '"' : '') + (c.step ? ' step="' + c.step + '"' : '') +
      ' value="' + escapeHtml(val) + '">' +
      (c.suffix ? '<span class="inbox__fix">' + escapeHtml(c.suffix) + '</span>' : '') +
      '</div>';
  }
  let meta = '';
  if (c.configPath) {
    meta = '<div class="field__meta"><span>Config: ' + formatMXN(cfgVal) + '</span>' +
      (isOv ? '<button class="linkbtn" data-action="reset-campo" data-id="' + c.id + '"' + attrProc(k) + '>Restablecer</button><span class="badge badge--i">' + ico('bolt', 13) + 'Solo esta cotización</span>' : '') +
      '</div>';
  }
  return '<div class="field' + (isOv ? ' is-overridden' : '') + '" data-fieldwrap="' + claveWrap(c.id, k) + '">' +
    '<div class="field__top"><label class="field__lbl" for="' + eid + '">' + escapeHtml(c.label) + '</label></div>' +
    '<div class="field__ctl">' + ctl + '</div>' +
    (c.hint ? '<p class="field__hint">' + escapeHtml(c.hint) + '</p>' : '') + meta +
    '</div>';
}

function derivadoFila(label, valor) {
  return '<div class="derived"><span>' + escapeHtml(label) + '</span><b>' + valor + '</b></div>';
}
function derivadoLaserHTML(k) {
  if (k === undefined) k = null;
  const pr = procDe(k);
  if (!pr) return '';
  const filas = [];
  const d = derivadoCompra(k);
  if (d) filas.push(derivadoFila(d.label, d.valor >= 1 ? formatMXN(d.valor) : '$' + formatNum(d.valor, 4)));
  const n = numCapas(pr.inputs);
  if (n > 1) {
    const esp = especCapas(pr.tecnica, pr.producto, pr.inputs);
    const plural = esp ? esp.plural : 'capas';
    let cap = null;
    try { cap = calcularBreakdown(pr.tecnica, inputsParaMotor(k), state.config).capas; } catch (e) { cap = null; }
    if (cap) {
      filas.push(derivadoFila('Material de ' + cap.n + ' ' + plural, formatMXN(cap.materialTotal)));
      if (cap.minutosExtra > 0) filas.push(derivadoFila('Tiempo extra por ' + plural, '+' + formatNum(cap.minutosExtra, 0) + ' min'));
    }
  }
  if (!filas.length) return '';
  return '<div style="padding:0 16px 14px">' + filas.join('') + '</div>';
}

/* ---- Capas / colores ---- */
function campoCapaHTML(f, capa, i, k) {
  const fac = f.factor || 1;
  const raw = capa[f.key];
  // Igual que en los campos normales: se guarda en unidad base, se muestra en unidad de compra.
  const val = (fac !== 1 && raw !== '' && raw !== undefined && raw !== null) ? Math.round(Number(raw) * fac * 1e6) / 1e6 : raw;
  const cfgBase = f.configPath ? getPath(state.config, f.configPath) : null;
  const isOv = !!f.configPath && !casiIgual(raw, cfgBase);
  const mode = f.type === 'int' ? 'numeric' : 'decimal';
  return '<label class="capa__f' + (isOv ? ' is-overridden' : '') + '" data-capawrap="' + claveWrap(i + '-' + f.key, k) + '">' +
    '<span>' + escapeHtml(f.label) + '</span>' +
    '<div class="inbox">' +
    (f.prefix ? '<span class="inbox__fix">' + escapeHtml(f.prefix) + '</span>' : '') +
    '<input data-capa-field="' + f.key + '" data-i="' + i + '"' + attrProc(k) + ' data-type="' + f.type + '" data-factor="' + fac + '" type="number" inputmode="' + mode + '"' +
    (f.min !== undefined ? ' min="' + f.min + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') +
    ' value="' + escapeHtml(val) + '">' +
    (f.suffix ? '<span class="inbox__fix">' + escapeHtml(f.suffix) + '</span>' : '') +
    '</div>' +
    (f.configPath ? '<span class="capa__cfg">Config: ' + formatMXN(cfgBase * fac) + (isOv ? ' · ajustado' : '') + '</span>' : '') +
    '</label>';
}

/* Sólo los renglones: los reusan el panel principal y los procesos extra. */
function capasFilasHTML(esp, k) {
  const capas = procDe(k).inputs.capas || [];
  return capas.map((c, i) =>
    '<div class="capa" data-capa="' + claveWrap(String(i), k) + '"' + attrProc(k) + '>' +
    '<div class="capa__hd">' +
    '<span class="capa__n">' + (i + 1) + '</span>' +
    '<input class="capa__name" type="text" data-capa-nombre="' + i + '"' + attrProc(k) + ' value="' + escapeHtml(c.nombre || '') + '" placeholder="' + escapeHtml(esp.placeholder) + '" aria-label="Nombre de ' + escapeHtml(esp.singular) + ' ' + (i + 1) + '">' +
    (capas.length > 1 ? '<button class="capa__del" data-action="capa-del" data-i="' + i + '"' + attrProc(k) + ' aria-label="Quitar ' + escapeHtml(esp.singular) + ' ' + (i + 1) + '">' + ico('trash', 17) + '</button>' : '') +
    '</div>' +
    '<div class="capa__grid">' + esp.campos.map(f => campoCapaHTML(f, c, i, k)).join('') + '</div>' +
    '</div>'
  ).join('');
}
function capasAltaHTML(esp, k) {
  const capas = procDe(k).inputs.capas || [];
  if (capas.length >= MAX_CAPAS) return '';
  return '<button class="capa__add" data-action="capa-add"' + attrProc(k) + '>' + ico('plus', 16) + escapeHtml(esp.alta) + '</button>';
}

function capasHTML() {
  const esp = especCapas(state.cot.tecnica, state.cot.producto, state.cot.inputs);
  if (!esp) return '';
  const capas = state.cot.inputs.capas || [];
  return '<div class="sec">' +
    '<div class="sec__hd"><span class="sec__t">' + escapeHtml(esp.titulo) + '</span>' +
    '<span class="sec__aside" id="capasCount">' + capas.length + ' ' + escapeHtml(capas.length === 1 ? esp.singular : esp.plural) + '</span></div>' +
    '<div class="panel" id="capasPanel">' + capasFilasHTML(esp, null) +
    '<div id="derivado">' + derivadoLaserHTML(null) + '</div>' +
    capasAltaHTML(esp, null) +
    '</div>' +
    (esp.ayuda ? '<p class="capas__hint">' + escapeHtml(esp.ayuda) + '</p>' : '') +
    '</div>';
}

/* Refresca el aviso de override de una capa sin tocar su input (conserva el foco). */
function refrescarMetaCapa(i, key, k) {
  if (k === undefined) k = null;
  const pr = procDe(k);
  const esp = especCapas(pr.tecnica, pr.producto, pr.inputs);
  if (!esp) return;
  const f = esp.campos.find(x => x.key === key);
  if (!f || !f.configPath) return;
  const wrap = document.querySelector('[data-capawrap="' + claveWrap(i + '-' + key, k) + '"]');
  if (!wrap) return;
  const cfgBase = getPath(state.config, f.configPath);
  const isOv = !casiIgual((pr.inputs.capas[i] || {})[key], cfgBase);
  wrap.classList.toggle('is-overridden', isOv);
  const cfg = wrap.querySelector('.capa__cfg');
  if (cfg) cfg.textContent = 'Config: ' + formatMXN(cfgBase * (f.factor || 1)) + (isOv ? ' · ajustado' : '');
}

/* ============ 13. BARRA DE MERCADO ============ */
function mercadoHTML(res) {
  const { tecnica, producto } = state.cot;
  const gramos = tecnica === 'impresion3d' ? gramosTotales() : null;
  const ref = obtenerReferenciaMercado(tecnica, producto, res.rango ? res.rango.etiqueta : 'Menudeo', gramos);
  if (!ref) {
    return '<div class="panel panel--pad"><p class="mkt__msg">' + ico('info', 16) + ' Sin dato de mercado confiable para esta combinación. Guíate por tu costo y utilidad.</p></div>';
  }
  const [lo, hi] = ref.rango;
  const p = res.precioFinal;
  const min = lo * 0.7, max = hi * 1.3;
  const pos = v => clamp(((v - min) / (max - min)) * 100, 0, 100);
  let estado, texto;
  if (p < lo) { estado = 'w'; texto = 'Estás por debajo del mercado. Hay espacio para subir el precio.'; }
  else if (p > hi) { estado = 'd'; texto = 'Estás por encima del mercado. Justifica el valor o revisa tus costos.'; }
  else { estado = 'p'; texto = 'Tu precio está dentro del rango de mercado.'; }
  return '<div class="panel panel--pad">' +
    '<div class="mkt__hd"><span class="badge badge--' + estado + '">' + (estado === 'p' ? ico('check', 13) : ico('alert', 13)) + (estado === 'p' ? 'En rango' : estado === 'w' ? 'Bajo' : 'Alto') + '</span>' +
    '<span class="mkt__v">' + escapeHtml(ref.nota || '') + (ref.esMayoreo ? ' · mayoreo' : '') + '</span></div>' +
    '<div class="mkt__bar">' +
    '<div class="mkt__range" style="left:' + pos(lo) + '%; right:' + (100 - pos(hi)) + '%"></div>' +
    '<div class="mkt__mark" style="left:' + pos(p) + '%" data-v="' + formatMXN(p) + '"></div>' +
    '</div>' +
    '<div class="mkt__legend"><span>' + formatMXN(lo) + '</span><span>' + formatMXN(hi) + '</span></div>' +
    '<p class="mkt__msg">' + texto + (ref.porGramo ? ' Referencia calculada sobre ' + formatNum(gramos, 0) + ' g.' : '') + '</p>' +
    '</div>';
}

/* ============ 14. PANTALLA COTIZAR (una sola, precio en vivo) ============ */
const CANT_RAPIDAS = [1, 6, 12, 24, 50, 100];

function utilidadActual() {
  return state.cot.utilidadOverride === null || state.cot.utilidadOverride === undefined
    ? state.config.configGlobal.utilidadMenudeoPct : state.cot.utilidadOverride;
}
function comisionActiva() {
  return state.cot.aplicaComision === null || state.cot.aplicaComision === undefined
    ? !!state.config.configGlobal.aplicaComisionVentaOnline : !!state.cot.aplicaComision;
}
function calcularAhora() {
  const cantidad = Math.max(1, parseInt(state.cot.cantidad, 10) || 1);
  const bd = calcularBreakdownMulti(procesosParaMotor(), state.config);
  return calcularCotizacion({ breakdown: bd, cantidad, config: state.config, utilidadMenudeoPctOverride: utilidadActual(), aplicaComisionOverride: comisionActiva() });
}

/* Panel de un proceso extra: sus materiales, sus capas y sus tiempos. */
function procesoHTML(k) {
  const p = procesosExtra()[k];
  const campos = camposDeProceso(k);
  const mats = campos.filter(c => c.group === 'material');
  const tiempos = campos.filter(c => c.group === 'tiempo');
  const esp = especCapas(p.tecnica, p.producto, p.inputs);
  const prod = buscarProducto(p.tecnica, p.producto);
  return '<div class="proc" data-procwrap="' + k + '">' +
    '<div class="proc__hd">' +
    '<span class="proc__n">' + (k + 2) + '</span>' +
    '<span class="proc__t">' + escapeHtml(etiquetaProceso(k)) + '<small>' + escapeHtml(prod ? prod.label : '') + ' · encima de la misma pieza</small></span>' +
    '<button class="capa__del" data-action="proceso-del" data-proc="' + k + '" aria-label="Quitar este proceso">' + ico('trash', 17) + '</button>' +
    '</div>' +
    '<div class="proc__bd">' +
    '<div class="proc__st">Materiales</div>' +
    '<div class="fields">' + mats.map(c => campoHTML(c, k)).join('') + '</div>' +
    (esp ? '<div class="proc__st">' + escapeHtml(esp.titulo) + '</div>' + capasFilasHTML(esp, k) + capasAltaHTML(esp, k) : '') +

}

function procesosSecHTML() {
  const extra = procesosExtra();
  const disponibles = TECNICAS.filter(t => extra.length < MAX_PROCESOS);
  return '<div class="sec">' +
    '<div class="sec__hd"><span class="sec__t">Otros procesos sobre la misma pieza</span>' +

      ? '<div class="panel panel--pad"><p class="proc__hint">Si la misma playera lleva vinil, sublimación y grabado láser, agrégalos aquí: el blanco se cobra una sola vez y se suman materiales, máquina y tiempo.</p>' +
      '<div class="chips">' + disponibles.map(t => '<button class="chip chip--add" data-action="proceso-add" data-id="' + t.id + '">' + ico('plus', 15) + escapeHtml(t.label) + '</button>').join('') + '</div></div>'
      : '<div class="panel panel--pad"><p class="proc__hint">Llegaste al máximo de ' + MAX_PROCESOS + ' procesos extra.</p></div>') +

function renderCotizar() {

    '<div class="sec">' +
    '<div class="sec__hd"><span class="sec__t">Cantidad</span><span class="sec__aside" id="tierLbl">' + escapeHtml(rango.etiqueta) + (rango.descuentoPct > 0 ? ' · −' + Math.round(rango.descuentoPct * 100) + '%' : '') + '</span></div>' +
    '<div class="panel panel--pad">' +
    '<div class="stepper">' +
