/* Recalcula y refresca solo lo que cambia (no re-renderiza los inputs → no pierde foco). */
function actualizarVivo(sinFlash) {
  let res;
  try { res = calcularAhora(); }
  catch (e) { console.warn(e); return; }
  state.cot.resultado = res;

  const dock = document.getElementById('dock');
  const flags = [];
  if (res.descuentoPct > 0) flags.push('<span class="badge badge--n">' + escapeHtml(res.rango.etiqueta) + ' −' + Math.round(res.descuentoPct * 100) + '%</span>');
  if (res.seAplicoPiso) flags.push('<span class="badge badge--w">' + ico('alert', 13) + 'Piso de utilidad aplicado</span>');
  if (res.aplicaComision) flags.push('<span class="badge badge--i">Comisión ' + Math.round(res.comisionPct * 100) + '%</span>');
  const ovs = overridesActivos();
  if (ovs.length) flags.push('<span class="badge badge--i">' + ico('bolt', 13) + ovs.length + ' costo' + (ovs.length > 1 ? 's' : '') + ' ajustado' + (ovs.length > 1 ? 's' : '') + '</span>');

  dock.hidden = false;
  dock.innerHTML = '<div class="wrap">' +
    '<div class="dock__row">' +
    '<div><div class="dock__k">Precio por pieza</div><div class="dock__price" id="dockUnit">' + formatMXN(res.precioFinal) + '</div></div>' +
    '<div class="dock__total"><div class="dock__k">Total ' + state.cot.cantidad + ' pza' + (state.cot.cantidad > 1 ? 's' : '') + '</div><div class="v" id="dockTotal">' + formatMXN(res.totalPedido) + '</div></div>' +
    '</div>' +
    (flags.length ? '<div class="dock__flags">' + flags.join('') + '</div>' : '') +
    '<div class="dock__acts">' +
    '<button class="btn btn--sec btn--wide" data-action="ver-desglose">' + ico('layers', 18) + 'Desglose</button>' +
    '<button class="btn btn--sec" data-action="pdf-cot" aria-label="Descargar PDF" title="Descargar PDF">' + ico('pdf', 18) + '</button>' +
    '<button class="btn btn--pri btn--wide" data-action="guardar-cot">' + ico('save', 18) + 'Guardar</button>' +
    '</div></div>';
  if (!sinFlash) { const u = document.getElementById('dockUnit'); if (u) { u.classList.remove('flash'); void u.offsetWidth; u.classList.add('flash'); } }

  const mp = document.getElementById('mercadoPanel');
  if (mp) mp.innerHTML = mercadoHTML(res);
  const der = document.getElementById('derivado');
  if (der) der.innerHTML = derivadoLaserHTML();
  procesosExtra().forEach((_, k) => {
    const d = document.querySelector('[data-derivado="' + k + '"]');
    if (d) d.innerHTML = derivadoLaserHTML(k);
  });
  const tier = document.getElementById('tierLbl');
  if (tier) tier.textContent = res.rango.etiqueta + (res.descuentoPct > 0 ? ' · −' + Math.round(res.descuentoPct * 100) + '%' : '');
}

/* Refresca la meta de override de un campo sin tocar su input (conserva el foco). */
function refrescarMetaCampo(id, k) {
  if (k === undefined) k = null;
  const pr = procDe(k);
  const campos = camposFormulario(pr.tecnica, pr.producto, pr.inputs);
  const c = campos.find(x => x.id === id);
  if (!c || !c.configPath) return;
  const wrap = document.querySelector('[data-fieldwrap="' + claveWrap(id, k) + '"]');
  if (!wrap) return;
  const cfgVal = getPath(state.config, c.configPath);
  const f = c.factor || 1;
  const isOv = !casiIgual(pr.inputs[id], cfgVal);
  wrap.classList.toggle('is-overridden', isOv);
  let meta = wrap.querySelector('.field__meta');
  if (!meta) { meta = document.createElement('div'); meta.className = 'field__meta'; wrap.appendChild(meta); }
  meta.innerHTML = '<span>Config: ' + formatMXN(cfgVal * f) + (f !== 1 ? ' /kg' : '') + '</span>' +
    (isOv ? '<button class="linkbtn" data-action="reset-campo" data-id="' + id + '"' + attrProc(k) + '>Restablecer</button><span class="badge badge--i">' + ico('bolt', 13) + 'Solo esta cotización</span>' : '');
}
/* ============ 15. SHEET GENÉRICO ============ */
let sheetState = { onClose: null };
function abrirSheet(titulo, bodyHTML, footHTML, onClose) {
  document.getElementById('sheetTitle').textContent = titulo;
  document.getElementById('sheetBody').innerHTML = bodyHTML;
  document.getElementById('sheetFoot').innerHTML = footHTML || '';
  document.getElementById('sheetClose').innerHTML = ico('close', 17);
  document.getElementById('sheetWrap').hidden = false;
  document.body.style.overflow = 'hidden';
  sheetState.onClose = onClose || null;
}
function cerrarSheet() {
  document.getElementById('sheetWrap').hidden = true;
  document.body.style.overflow = '';
  const cb = sheetState.onClose; sheetState.onClose = null;
  if (cb) cb();
}
function confirmar(titulo, mensaje, textoOk, peligro) {
  return new Promise(resolve => {
    let decidido = false;
    abrirSheet(titulo,
      '<p style="font-size:14.5px;line-height:1.5;color:var(--ink-2);padding:2px 0 14px">' + escapeHtml(mensaje) + '</p>',
      '<button class="btn btn--ghost btn--wide" data-action="conf-no">Cancelar</button>' +
      '<button class="btn ' + (peligro ? 'btn--danger' : 'btn--pri') + ' btn--wide" data-action="conf-si">' + escapeHtml(textoOk || 'Aceptar') + '</button>',
      () => { if (!decidido) resolve(false); });
    const ft = document.getElementById('sheetFoot');
    ft.querySelector('[data-action="conf-no"]').onclick = () => { decidido = true; cerrarSheet(); resolve(false); };
    ft.querySelector('[data-action="conf-si"]').onclick = () => { decidido = true; cerrarSheet(); resolve(true); };
  });
}

function eliminarProductoPropio(id) {
  const i = state.productos.findIndex(p => p.id === id);
  if (i === -1) return;
  const prod = state.productos[i];
  state.productos.splice(i, 1);
  guardarProductosStorage(state.productos);
  delete state.ultimos[claveUltimos(prod.tecnica, id)];
  guardarUltimosStorage(state.ultimos);
  if (state.cot.producto === id) {
    const base = productosDe(prod.tecnica)[0];
    cargarCombinacion(prod.tecnica, base ? base.id : 'taza');
  }
  showToast(prod.label + ' eliminado');
}

/* ============ 16. SNAPSHOT ============ */
function construirSnapshot() {
  const res = state.cot.resultado || calcularAhora();
  const t = buscarTecnica(state.cot.tecnica), p = buscarProducto(state.cot.tecnica, state.cot.producto);
  return {
    id: generarId(),
    fecha: new Date().toISOString(),
    cliente: '',
    tecnica: state.cot.tecnica, tecnicaLabel: t ? t.label : state.cot.tecnica,
    producto: state.cot.producto, productoLabel: p ? p.label : state.cot.producto,
    cantidad: state.cot.cantidad,
    inputs: JSON.parse(JSON.stringify(state.cot.inputs)),
    procesos: JSON.parse(JSON.stringify(procesosExtra())),
    procesosLabel: procesosExtra().map((_, k) => etiquetaProceso(k)),
    utilidadOverride: state.cot.utilidadOverride,
    aplicaComision: comisionActiva(),
    resultado: JSON.parse(JSON.stringify(res))
  };
}

/* ============ 17. DESGLOSE ============ */
function lineaHTML(k, v, sub, cls) {
  return '<div class="bd-l' + (cls ? ' ' + cls : '') + '"><div class="bd-l__k">' + k + (sub ? '<small>' + sub + '</small>' : '') + '</div><div class="bd-l__v">' + v + '</div></div>';
}
function desgloseHTML(snap) {
  const res = snap.resultado, bd = res.breakdown;
  const cant = snap.cantidad;
  let h = '';

  if (bd.procesos && bd.procesos.length > 1) {
    h += '<div class="bd-group"><div class="bd-group__t">Procesos sobre la misma pieza</div>';
    for (const p of bd.procesos) h += lineaHTML(escapeHtml(p.label), formatMXN(p.costo), 'costo directo de este proceso');
    h += lineaHTML('El blanco se cobra una sola vez', '', '', 'bd-l--muted');
    h += '</div>';
  }

  h += '<div class="bd-group"><div class="bd-group__t">Materiales por pieza</div>';
  if (bd.materiales.lineas && bd.materiales.lineas.length) {
    let procActual = null;
    for (const L of bd.materiales.lineas) {
      if (L.proceso && L.proceso !== procActual) { procActual = L.proceso; h += '<div class="bd-sub">' + escapeHtml(procActual) + '</div>'; }
      const sub = (L.qty !== undefined && L.unidad) ? formatNum(L.qty, L.qty % 1 === 0 ? 0 : 2) + ' ' + L.unidad + ' × ' + formatMXN(L.unitario) + (L.override ? ' · ajustado (config ' + formatMXN(L.valorConfig) + ')' : '') : '';
      h += lineaHTML(escapeHtml(L.label), formatMXN(L.total), sub);
    }
  } else {
    h += lineaHTML('Materiales', formatMXN(bd.materiales.base));
  }
  h += lineaHTML('Merma ' + Math.round(bd.materiales.mermaPct * 100) + '%', '+' + formatMXN(bd.materiales.total - bd.materiales.base), '', 'bd-l--muted');
  h += lineaHTML('Subtotal materiales', formatMXN(bd.materiales.total), '', 'bd-l--sum');
  h += '</div>';

  h += '<div class="bd-group"><div class="bd-group__t">Máquina por pieza</div>';
  for (const d of bd.maquina.detalle) {
    h += lineaHTML(escapeHtml(d.nombre) + (d.proceso ? ' <small style="opacity:.7">· ' + escapeHtml(d.proceso) + '</small>' : ''),
      formatMXN(d.subtotal),
      formatNum(d.horas * 60, 1) + ' min × ' + formatMXN(d.costoHora) + '/h · dep ' + formatMXN(d.dep) + ' + mant ' + formatMXN(d.mant) + ' + luz ' + formatMXN(d.luz));
  }
  h += lineaHTML('Subtotal máquina', formatMXN(bd.maquina.total), '', 'bd-l--sum');
  h += '</div>';

  h += '<div class="bd-group"><div class="bd-group__t">Mano de obra por pieza</div>';
  h += lineaHTML('Producción', formatMXN(bd.manoObra.costoProduccion), formatNum(bd.manoObra.produccionMin, 1) + ' min' + (bd.manoObra.supervisionProrrateada !== undefined ? ' (incluye supervisión prorrateada)' : ''));
  h += lineaHTML('Diseño prorrateado', formatMXN(bd.manoObra.costoDiseno), formatNum(bd.manoObra.disenoMinOriginal, 0) + ' min ÷ ' + cant + ' pzas = ' + formatNum(bd.manoObra.disenoMinProrrateado, 2) + ' min');
  h += lineaHTML('Subtotal mano de obra', formatMXN(bd.manoObra.total), '', 'bd-l--sum');
  h += '</div>';

  h += '<div class="bd-group"><div class="bd-group__t">Del costo al precio</div>';
  h += lineaHTML('Costo directo', formatMXN(res.costoDirecto));
  h += lineaHTML('Gastos indirectos', '+' + formatMXN(res.costoTotal - res.costoDirecto), Math.round(state.config.configGlobal.overheadPct * 100) + '% de overhead');
  h += lineaHTML('Costo total', formatMXN(res.costoTotal), '', 'bd-l--sum');
  h += lineaHTML('Precio menudeo', formatMXN(res.precioMenudeoFinal), 'utilidad ' + Math.round(res.utilidadPctUsada * 1000) / 10 + '% · redondeado desde ' + formatMXN(res.precioMenudeoBruto));
  if (res.descuentoPct > 0) h += lineaHTML('Descuento ' + escapeHtml(res.rango.etiqueta), '−' + Math.round(res.descuentoPct * 100) + '%', formatMXN(res.precioConDescuento));
  h += lineaHTML('Piso de utilidad mínima', formatMXN(res.piso), Math.round(state.config.configGlobal.utilidadMinimaPct * 100) + '% sobre costo total', 'bd-l--muted');
  if (res.aplicaComision && res.montoComision > 0) h += lineaHTML('Comisión venta en línea', '+' + formatMXN(res.montoComision), Math.round(res.comisionPct * 100) + '% repercutido');
  h += lineaHTML('Precio final por pieza', formatMXN(res.precioFinal), '', 'bd-l--sum bd-l--big');
  h += lineaHTML('Total del pedido (' + cant + ' pzas)', formatMXN(res.totalPedido), '', 'bd-l--sum bd-l--big');
  h += '</div>';

  if (res.seAplicoPiso) h += '<div class="note note--w">' + ico('alert', 17) + '<span>El descuento por volumen bajaba el precio por debajo de tu utilidad mínima, así que se aplicó el piso. Considera reducir el descuento o el costo.</span></div>';

  const util = res.precioFinal - res.costoTotal;
  h += '<div class="note note--' + (util > 0 ? 'p' : 'w') + '">' + ico(util > 0 ? 'check' : 'alert', 17) + '<span>Ganas ' + formatMXN(util) + ' por pieza (' + formatNum((util / res.costoTotal) * 100, 1) + '% sobre costo) · ' + formatMXN(util * cant) + ' en todo el pedido.</span></div>';
  return h;
}

/* Todas las técnicas que lleva la pieza, para el cliente (sin costos). */
function tecnicasSnapshot(snap) {
  const bd = snap.resultado && snap.resultado.breakdown;
  if (bd && bd.procesos && bd.procesos.length > 1) return bd.procesos.map(p => p.label);
  if (Array.isArray(snap.procesosLabel) && snap.procesosLabel.length) return [snap.tecnicaLabel].concat(snap.procesosLabel);
  return [snap.tecnicaLabel];
}

function construirTextoWhatsApp(snap) {
  const res = snap.resultado;
  const L = [];
  L.push('*Cotización — ' + snap.productoLabel + '*');
  L.push(tecnicasSnapshot(snap).join(' + ') + ' · ' + snap.cantidad + ' pza' + (snap.cantidad > 1 ? 's' : ''));
  L.push('');
  L.push('Precio por pieza: *' + formatMXN(res.precioFinal) + '*');
  L.push('Total del pedido: *' + formatMXN(res.totalPedido) + '*');
  if (res.descuentoPct > 0) L.push('Incluye descuento de ' + Math.round(res.descuentoPct * 100) + '% por volumen (' + res.rango.etiqueta + ').');
  L.push('');
  L.push('Precio sujeto a cambios sin previo aviso.');
  return L.join('\n');
}
function abrirWhatsApp(snap) {
  window.open('https://wa.me/?text=' + encodeURIComponent(construirTextoWhatsApp(snap)), '_blank');
}

function verDesglose(snap) {
  abrirSheet('Desglose', desgloseHTML(snap),
    '<button class="btn btn--ghost btn--wide" data-action="cerrar-sheet">Cerrar</button>' +
    '<button class="btn btn--sec btn--wide" data-action="copiar-desglose">' + ico('copy', 17) + 'Copiar</button>');

    const txt = construirTextoWhatsApp(snap);
    navigator.clipboard.writeText(txt).then(() => showToast('Cotización copiada')).catch(() => showToast('No se pudo copiar', 'error'));
  };
}

/* ============ 17b. COTIZACIÓN EN PDF (para el cliente) ============
   OJO: este documento es para el CLIENTE. No lleva costos, márgenes ni
   desglose interno; sólo lo que él tiene que ver: qué, cuánto y cuánto cuesta. */
function folioDe(snap) {
  return 'COT-' + new Date(snap.fecha).toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(snap.id || '').slice(-4).toUpperCase();
}
function cotizacionPDFHTML(snap) {
  const res = snap.resultado;
  const neg = state.config.negocio || {};
  const nombre = (neg.nombre || '').trim();
  const tel = (neg.telefono || '').trim();
  const dias = Number(neg.validezDias) || 15;
  const f = new Date(snap.fecha);
  const vence = new Date(f.getTime() + dias * 86400000);
  const fFecha = d => d.toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });

  return '' +
    '<div class="pd__hd">' +
    '<div><p class="pd__neg">' + escapeHtml(nombre || 'Cotización') + '</p>' +
    (tel ? '<p class="pd__tel">' + escapeHtml(tel) + '</p>' : '') + '</div>' +
    '<div class="pd__meta"><b>' + escapeHtml(folioDe(snap)) + '</b><br>' + escapeHtml(fFecha(f)) + '</div>' +
    '</div>' +

    (nombre ? '<p class="pd__t">Cotización</p>' : '') +
    '<p class="pd__cli">' + (snap.cliente ? 'Para: <b>' + escapeHtml(snap.cliente) + '</b>' : 'Presupuesto') + '</p>' +

    '<table class="pd__tbl">' +
    '<colgroup><col class="c-desc"><col class="c-cant"><col class="c-pu"><col class="c-imp"></colgroup>' +
    '<thead><tr>' +
    '<th>Concepto</th><th class="num">Cantidad</th><th class="num">Precio unitario</th><th class="num">Importe</th>' +
    '</tr></thead><tbody><tr>' +
    '<td class="pd__desc"><b>' + escapeHtml(snap.productoLabel) + '</b><small>' + escapeHtml(tecnicasSnapshot(snap).join(' + ')) + ' · personalizado</small></td>' +
    '<td class="num">' + snap.cantidad + '</td>' +
    '<td class="num">' + formatMXN(res.precioFinal) + '</td>' +
    '<td class="num">' + formatMXN(res.totalPedido) + '</td>' +
    '</tr></tbody></table>' +

    '<div class="pd__tot"><span>Total</span><b>' + formatMXN(res.totalPedido) + '</b></div>' +

    '<p class="pd__nota">' +
    (res.descuentoPct > 0 ? 'Precio con descuento por volumen de ' + Math.round(res.descuentoPct * 100) + '% (' + escapeHtml(res.rango.etiqueta) + ').<br>' : '') +
    'Vigencia de esta cotización: ' + escapeHtml(fFecha(vence)) + ' (' + dias + ' días).<br>' +
    'Precios en pesos mexicanos. El tiempo de entrega se confirma al aprobar el pedido.' +
    '</p>';
}

function descargarPDF(snap) {
  const doc = document.getElementById('printDoc');
  if (!doc) return;
  doc.innerHTML = cotizacionPDFHTML(snap);
  const tituloPrevio = document.title;
  // El navegador usa el título del documento como nombre sugerido del archivo.
  document.title = folioDe(snap) + (snap.cliente ? ' - ' + snap.cliente : '');
  const limpiar = () => { document.title = tituloPrevio; window.removeEventListener('afterprint', limpiar); };
  window.addEventListener('afterprint', limpiar);
  setTimeout(() => { window.print(); setTimeout(limpiar, 1500); }, 60);
}

  const s = buscarSnapshot(id);
  if (!s) return;
  state.cot.tecnica = s.tecnica;
  state.cot.producto = s.producto;
  state.cot.cantidad = Math.max(1, s.cantidad || 1);
  state.cot.inputs = defaultsFormulario(s.tecnica, s.producto, s.inputs || {});
  state.cot.procesos = (Array.isArray(s.procesos) ? s.procesos : [])
    .filter(p => p && p.tecnica && PRODUCTOS[p.tecnica])
    .map(p => {
      const producto = buscarProducto(p.tecnica, p.producto) ? p.producto : productoParaProceso(p.tecnica, s.producto);
      const inputs = defaultsFormulario(p.tecnica, producto, p.inputs || {});
      inputs.costoBlanco = 0;
      return { tecnica: p.tecnica, producto, inputs };
    });

/* ============ 20. EXPORTAR / IMPORTAR ============ */
function exportarConfig() {
  try {
    const payload = Object.assign({}, state.configDraft || state.config, { productosPropios: state.productos });
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cotizador-config-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    showToast('Configuración exportada');
  } catch (e) { showToast('No se pudo exportar', 'error'); }
}
function importarConfig() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const datos = JSON.parse(rd.result);
        if (Array.isArray(datos.productosPropios)) {
          state.productos = datos.productosPropios.filter(p => p && p.id && p.tecnica);
          guardarProductosStorage(state.productos);
        }
        delete datos.productosPropios;
        state.configDraft = mergeConfigProfundo(clonarConfig(CONFIG_DEFAULT), datos);
        renderConfig();
        showToast('Configuración cargada, revisa y guarda');
      } catch (e) { showToast('Archivo inválido', 'error'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function claveUltimos(t, p) { return t + '_' + p; }
function recordarUltimos() {
  state.ultimos[claveUltimos(state.cot.tecnica, state.cot.producto)] = Object.assign(
    { __cant: state.cot.cantidad, __procesos: JSON.parse(JSON.stringify(procesosExtra())) },
    state.cot.inputs);
  guardarUltimosStorage(state.ultimos);
}
function cargarCombinacion(tecnica, producto) {
  const prev = state.ultimos[claveUltimos(tecnica, producto)] || {};
  const cant = prev.__cant;
  const procs = prev.__procesos;
  const limpio = Object.assign({}, prev); delete limpio.__cant; delete limpio.__procesos;
  state.cot.tecnica = tecnica;
  state.cot.producto = producto;
  state.cot.inputs = defaultsFormulario(tecnica, producto, limpio);
  if (Array.isArray(procs)) state.cot.procesos = procs.filter(p => p && p.tecnica && PRODUCTOS[p.tecnica]);
  if (cant) state.cot.cantidad = Math.max(1, parseInt(cant, 10) || 1);
  reajustarProcesos();
  renderCotizar();
}

/* ============ 23. EVENTOS ============ */
function onInput(e) {
  const el = e.target;

  if (el.id === 'f-cantidad') {
    state.cot.cantidad = Math.max(1, parseInt(el.value, 10) || 1);
    document.querySelectorAll('[data-action="cant-set"]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === state.cot.cantidad)));
    actualizarVivo(); recordarUltimos(); return;
  }
  if (el.id === 'utilSlider') {
    state.cot.utilidadOverride = Number(el.value) / 100;
    const v = document.getElementById('utilVal');
    if (v) v.textContent = formatNum(Number(el.value), 0) + '%';
    actualizarVivo(); return;
  }
  if (el.id === 'q-hist') { state.filtroHistorial = el.value; renderHistorial(); const i = document.getElementById('q-hist'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }

  if (el.dataset.capaNombre !== undefined) {
    const k = procK(el), pr = procDe(k);
    const i = Number(el.dataset.capaNombre);
    const capa = (pr.inputs.capas || [])[i];
    if (!capa) return;
    capa.nombre = el.value;
    actualizarVivo(); recordarUltimos(); return;
  }
  if (el.dataset.capaField) {
    const k = procK(el), pr = procDe(k);
    const i = Number(el.dataset.i), key = el.dataset.capaField, tipo = el.dataset.type;
    const capa = (pr.inputs.capas || [])[i];
    if (!capa) return;
    const factor = Number(el.dataset.factor) || 1;
    const crudo = el.value === '' ? '' : (tipo === 'int' ? (parseInt(el.value, 10) || 0) : (parseFloat(el.value) || 0));
    capa[key] = crudo === '' ? '' : (factor !== 1 ? crudo / factor : crudo);
    refrescarMetaCapa(i, key, k);
    actualizarVivo(); recordarUltimos(); return;
  }

  if (el.dataset.field) {
    const k = procK(el), pr = procDe(k);
    const id = el.dataset.field, tipo = el.dataset.type;
    // Selects que cambian QUÉ campos se muestran: hay que reconstruir el formulario.
    const MODOS = ['hojaModo', 'vinilModo', 'materialModo', 'filamentoModo'];
    if (tipo === 'select' && MODOS.indexOf(id) !== -1) {
      pr.inputs[id] = el.value;
      pr.inputs = defaultsFormulario(pr.tecnica, pr.producto, pr.inputs);
      if (k === null) state.cot.inputs = pr.inputs; else { procesosExtra()[k].inputs = pr.inputs; pr.inputs.costoBlanco = 0; }
      renderCotizar(); recordarUltimos(); return;
    }
    if (tipo === 'select') {
      pr.inputs[id] = el.value;
      if (id === 'tipoFilamento') {
        // El costo por gramo depende del filamento: cada color vuelve al default del nuevo material.
        const cfg = el.value === 'PLA' ? 'catalogoInsumos.impresion3d.costoPorGramoPLA' : 'catalogoInsumos.impresion3d.costoPorGramoPETG';
        const nuevo = getPath(state.config, cfg);
        (pr.inputs.capas || []).forEach(c => { c.costoPorGramo = nuevo; });
        renderCotizar(); recordarUltimos(); return;
      }
    } else {
      const factor = Number(el.dataset.factor) || 1;
      const crudo = el.value === '' ? '' : (tipo === 'int' ? (parseInt(el.value, 10) || 0) : (parseFloat(el.value) || 0));
      pr.inputs[id] = crudo === '' ? '' : (factor !== 1 ? crudo / factor : crudo);
    }
    refrescarMetaCampo(id, k);
    actualizarVivo(); recordarUltimos(); return;
  }

  if (el.dataset.cfg) {
    const path = el.dataset.cfg, tipo = el.dataset.cfgtype;
    if (tipo === 'text') { setPath(state.configDraft, path, el.value); renderDirtyBar(); return; }
    let v = parseFloat(el.value);
    if (isNaN(v)) v = 0;
    setPath(state.configDraft, path, tipo === 'pct' ? v / 100 : v);
    if (path.indexOf('maquinas.') === 0 || path === 'configGlobal.tarifaKwh' || path === 'configGlobal.valorRescatePct') {
      const id = path.split('.')[1];
      if (state.configDraft.maquinas[id]) {
        const m = state.configDraft.maquinas[id];
        const ch = costoMaquinaHora(m, state.configDraft.configGlobal.tarifaKwh, state.configDraft.configGlobal.valorRescatePct);
        const row = document.querySelector('[data-action="toggle-maquina"][data-id="' + id + '"] small');
        if (row) row.textContent = formatMXN(ch.total) + ' por hora';
      }
    }
    renderDirtyBar(); return;
  }
}

function onClick(e) {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;

  if (a === 'tab') { cambiarTab(b.dataset.id); return; }
  if (a === 'cerrar-sheet') { cerrarSheet(); return; }

  if (a === 'elegir-tecnica') {
    if (b.dataset.id === state.cot.tecnica) return;
    recordarUltimos();
    const nueva = b.dataset.id;
    cargarCombinacion(nueva, PRODUCTOS[nueva][0].id); return;
  }
  if (a === 'nuevo-producto') { sheetNuevoProducto(); return; }
  if (a === 'pdf-cot') { sheetPDF(); return; }
  if (a === 'pdf-hist') {
    const snap = buscarSnapshot(b.dataset.id);
    if (snap) descargarPDF(snap);
    return;
  }
  if (a === 'borrar-producto') {
    const prod = state.productos.find(p => p.id === b.dataset.id);
    if (!prod) return;
    confirmar('Eliminar producto', '¿Quitar "' + prod.label + '" de tu catálogo? Las cotizaciones ya guardadas no se tocan.', 'Eliminar', true)
      .then(ok => { if (ok) { eliminarProductoPropio(prod.id); renderConfig(); } });
    return;
  }
  if (a === 'elegir-producto') {
    if (b.dataset.id === state.cot.producto) return;
    recordarUltimos();
    cargarCombinacion(state.cot.tecnica, b.dataset.id); return;
  }
  if (a === 'cant-menos' || a === 'cant-mas') {
    state.cot.cantidad = Math.max(1, state.cot.cantidad + (a === 'cant-mas' ? 1 : -1));
    const i = document.getElementById('f-cantidad'); if (i) i.value = state.cot.cantidad;
    document.querySelectorAll('[data-action="cant-set"]').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.n) === state.cot.cantidad)));
    actualizarVivo(); recordarUltimos(); return;
  }
  if (a === 'cant-set') {
    state.cot.cantidad = Number(b.dataset.n);
    const i = document.getElementById('f-cantidad'); if (i) i.value = state.cot.cantidad;
    document.querySelectorAll('[data-action="cant-set"]').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.n) === state.cot.cantidad)));
    actualizarVivo(); recordarUltimos(); return;
  }
  if (a === 'reset-campo') {
    const k = procK(b), pr = procDe(k);
    const campos = camposFormulario(pr.tecnica, pr.producto, pr.inputs);
    const c = campos.find(x => x.id === b.dataset.id);
    if (!c) return;
    pr.inputs[c.id] = getPath(state.config, c.configPath);
    const inp = document.getElementById(idCampo(c.id, k)); if (inp) inp.value = pr.inputs[c.id] * (c.factor || 1);
    refrescarMetaCampo(c.id, k); actualizarVivo(); recordarUltimos(); return;
  }
  if (a === 'capa-add') {
    const k = procK(b), pr = procDe(k);
    const esp = especCapas(pr.tecnica, pr.producto, pr.inputs);
    if (!esp) return;
    const arr = (pr.inputs.capas || []).slice();
    if (arr.length >= MAX_CAPAS) { showToast('Máximo ' + MAX_CAPAS + ' ' + esp.plural, 'error'); return; }
    arr.push(capaNueva(esp));
    pr.inputs.capas = arr;
    const rehecho = defaultsFormulario(pr.tecnica, pr.producto, pr.inputs);
    if (k === null) state.cot.inputs = rehecho; else { rehecho.costoBlanco = 0; procesosExtra()[k].inputs = rehecho; }
    renderCotizar(); recordarUltimos();
    const nuevo = document.querySelector('[data-capa-nombre="' + (arr.length - 1) + '"]' + (k === null ? ':not([data-proc])' : '[data-proc="' + k + '"]'));
    if (nuevo) nuevo.focus();
    return;
  }
  if (a === 'capa-del') {
    const k = procK(b), pr = procDe(k);
    const arr = (pr.inputs.capas || []).slice();
    if (arr.length <= 1) return;
    arr.splice(Number(b.dataset.i), 1);
    pr.inputs.capas = arr;
    const rehecho = defaultsFormulario(pr.tecnica, pr.producto, pr.inputs);
    if (k === null) state.cot.inputs = rehecho; else { rehecho.costoBlanco = 0; procesosExtra()[k].inputs = rehecho; }
    renderCotizar(); recordarUltimos(); return;
  }
  if (a === 'proceso-add') {
    const extra = procesosExtra();
    if (extra.length >= MAX_PROCESOS) { showToast('Máximo ' + MAX_PROCESOS + ' procesos extra', 'error'); return; }
    const t = b.dataset.id;
    if (!PRODUCTOS[t]) return;
    const prod = productoParaProceso(t, state.cot.producto);
    const previos = Object.assign({}, state.ultimos[claveUltimos(t, prod)] || {});
    delete previos.__cant;
    extra.push(procesoNuevo(t, previos));
    renderCotizar(); recordarUltimos();
    showToast(buscarTecnica(t).label + ' agregado a la misma pieza');
    return;
  }
  if (a === 'proceso-del') {
    procesosExtra().splice(Number(b.dataset.proc), 1);
    renderCotizar(); recordarUltimos(); return;
  }
  if (a === 'reset-utilidad') { state.cot.utilidadOverride = null; renderCotizar(); return; }
  if (a === 'toggle-comision') {
    state.cot.aplicaComision = !comisionActiva();
    b.setAttribute('aria-checked', String(state.cot.aplicaComision));
    actualizarVivo(); return;
  }
  if (a === 'ver-desglose') { verDesglose(construirSnapshot()); return; }
  if (a === 'guardar-cot') { sheetGuardar(); return; }

  if (a === 'hist-desglose') { const s = buscarSnapshot(b.dataset.id); if (s) verDesglose(s); return; }
  if (a === 'hist-wa') { const s = buscarSnapshot(b.dataset.id); if (s) abrirWhatsApp(s); return; }
  if (a === 'hist-dup') { duplicarSnapshot(b.dataset.id); return; }
  if (a === 'hist-del') {
    confirmar('Borrar cotización', '¿Seguro que quieres borrar esta cotización del historial?', 'Borrar', true).then(ok => {
      if (!ok) return;
      state.historial = state.historial.filter(s => s.id !== b.dataset.id);
      guardarHistorialStorage(state.historial); renderHistorial(); showToast('Cotización borrada');
    });
    return;
  }
  if (a === 'limpiar-historial') {
    confirmar('Borrar historial', 'Se eliminarán las ' + state.historial.length + ' cotizaciones guardadas en este dispositivo.', 'Borrar todo', true).then(ok => {
      if (!ok) return;
      state.historial = []; guardarHistorialStorage(state.historial); renderHistorial(); showToast('Historial vacío');
    });
    return;
  }

  if (a === 'toggle-maquina') { maquinaAbierta = maquinaAbierta === b.dataset.id ? null : b.dataset.id; renderConfig(); return; }
  if (a === 'cfg-switch') {
    const path = b.dataset.path;
    setPath(state.configDraft, path, !getPath(state.configDraft, path));
    b.setAttribute('aria-checked', String(!!getPath(state.configDraft, path)));
    renderDirtyBar(); return;
  }
  if (a === 'guardar-config') {
    state.config = clonarConfig(state.configDraft);
    guardarConfigStorage(state.config);
    state.cot.inputs = defaultsFormulario(state.cot.tecnica, state.cot.producto, state.cot.inputs);
    renderConfig(); showToast('Configuración guardada'); return;
  }
  if (a === 'descartar-config') { state.configDraft = clonarConfig(state.config); maquinaAbierta = null; renderConfig(); showToast('Cambios descartados'); return; }
  if (a === 'exportar') { exportarConfig(); return; }
  if (a === 'importar') { importarConfig(); return; }
  if (a === 'reset-config') {
    confirmar('Restablecer configuración', 'Se recuperarán todos los valores de fábrica y se perderán tus ajustes.', 'Restablecer', true).then(ok => {
      if (!ok) return;
      state.configDraft = clonarConfig(CONFIG_DEFAULT);
      state.config = clonarConfig(CONFIG_DEFAULT);
      guardarConfigStorage(state.config);
      state.cot.inputs = defaultsFormulario(state.cot.tecnica, state.cot.producto, {});
      maquinaAbierta = null; renderConfig(); showToast('Valores de fábrica restaurados');
    });
    return;
  }
}

/* ============ 24. INIT ============ */
function init() {
  state.cot.cantidad = 1;
  state.cot.inputs = defaultsFormulario(state.cot.tecnica, state.cot.producto, {});
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.type === 'select') onInput(e); });
  document.addEventListener('focusin', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'number') { try { e.target.select(); } catch (err) { } }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('sheetWrap').hidden) cerrarSheet();
  });
  const topbar = document.querySelector('.topbar');
  window.addEventListener('scroll', () => { topbar.classList.toggle('is-stuck', window.scrollY > 4); }, { passive: true });
  irTab('cotizar');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

/* ============ 25. MODO SIN INTERNET ============ */
/* Registra el service worker para que el cotizador abra aunque no haya senal
   (sobre todo desde el icono de la pantalla principal). Va despues de init y
   con guardas: si el navegador no lo soporta, o se abre como archivo local,
   simplemente no pasa nada y la app funciona igual. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('Sin modo offline:', e));
  });
}
</script>
